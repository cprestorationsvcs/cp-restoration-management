<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payroll Dashboard — CP Restoration</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',system-ui,sans-serif;background:#F1F5F9;min-height:100vh;}
header{background:#1B3A6B;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;}
header h1{color:white;font-size:16px;font-weight:800;}
header p{color:rgba(255,255,255,.7);font-size:12px;margin-top:2px;}
.auto-badge{background:#DCFCE7;color:#166534;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.container{max-width:1000px;margin:0 auto;padding:20px;}
.period-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.period-btn{padding:7px 16px;background:white;border:1.5px solid #E2E8F0;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;color:#64748B;}
.period-btn.active{background:#1B3A6B;color:white;border-color:#1B3A6B;}
.summary-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px;}
.sc{background:white;border-radius:10px;padding:12px 14px;box-shadow:0 2px 6px rgba(0,0,0,.05);text-align:center;}
.sn{font-size:22px;font-weight:800;color:#1B3A6B;}
.sl{font-size:11px;color:#64748B;margin-top:2px;}
.payroll-card{background:white;border-radius:12px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.05);overflow:hidden;}
.pc-header{background:#1B3A6B;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;}
.pc-date{color:white;font-size:15px;font-weight:800;}
.pc-period{color:rgba(255,255,255,.75);font-size:12px;}
.pc-total{color:#C9A84C;font-size:20px;font-weight:800;}
table{width:100%;border-collapse:collapse;}
th{font-size:11px;font-weight:700;color:#64748B;text-transform:uppercase;padding:10px 16px;border-bottom:2px solid #F1F5F9;text-align:left;}
td{font-size:13px;padding:11px 16px;border-bottom:1px solid #F8FAFC;color:#1E293B;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.base{color:#1B3A6B;font-weight:700;}
.bonus{color:#166534;font-weight:700;}
.total-pay{font-weight:800;font-size:14px;color:#1B3A6B;}
.held{background:#FFFBEB;}
.held-badge{background:#FEF3C7;color:#92400E;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:700;display:inline-block;}
.paid-badge{background:#DCFCE7;color:#166534;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:700;display:inline-block;}
.tr-total{background:#F8FAFC;font-weight:800;}
.deduct-note{font-size:11px;color:#DC2626;}
.daily-rate{font-size:11px;color:#64748B;}
.print-btn{padding:8px 18px;background:#1B3A6B;color:white;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:16px;}
@media print{.print-btn,.period-bar{display:none;}}
</style>
</head>
<body>
<header>
  <div>
    <h1>💰 Payroll Dashboard — CP Restoration Services</h1>
    <p>Auto-calculates base pay + bonuses from work_log • Updates in real time</p>
  </div>
  <span class="auto-badge">🔄 AUTO-CALCULATED</span>
</header>
<div class="container">
  <button class="print-btn" onclick="window.print()">🖨️ Print / Save PDF</button>

  <div class="period-bar">
    <button class="period-btn active" onclick="showPeriod('upcoming',this)">📅 Upcoming Pay Dates</button>
    <button class="period-btn" onclick="showPeriod('history',this)">📋 Pay History</button>
    <button class="period-btn" onclick="showPeriod('deductions',this)">⚠️ Deductions</button>
  </div>

  <div class="summary-strip">
    <div class="sc"><div class="sn" id="s-next">$0</div><div class="sl">Next Payroll Amount</div></div>
    <div class="sc"><div class="sn" id="s-next-date">—</div><div class="sl">Next Pay Date</div></div>
    <div class="sc"><div class="sn" id="s-total-bonus">$0</div><div class="sl">Bonuses This Period</div></div>
    <div class="sc"><div class="sn" id="s-headcount">8</div><div class="sl">Active Employees</div></div>
  </div>

  <div id="payroll-content"></div>
</div>

<script>
var _KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6a2ZlbWJhZ3BpdXVvZXhtcG95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NzYwNjEsImV4cCI6MjEwNjM1MjA2MX0.8euoI8CGkr3GBFiTrlaEmO8DtVyCF9jVaWPGORScg50';
var _SUPA = 'https://jzkfembagpiuuoexmpoy.supabase.co/rest/v1';
var _HDR  = {'apikey':_KEY,'Authorization':'Bearer '+_KEY};

// Employee roster with start dates and weekly pay
var ROSTER = [
  {name:'Queen Jearel Cruz',    email:'queen@mycprteam.com',    role:'Compliance',  start:'2026-09-21', weekly:200, dept:'Compliance'},
  {name:'Elna Palabrica',       email:'elna@mycprteam.com',     role:'CS Agent',    start:'2026-10-05', weekly:100, dept:'CS'},
  {name:'Alec Sarrosa',         email:'alec@mycprteam.com',     role:'CS Agent',    start:'2026-10-05', weekly:100, dept:'CS'},
  {name:'Marcelo Torres',       email:'marcelo@mycprteam.com',  role:'Dispute',     start:'2026-10-07', weekly:100, dept:'Dispute'},
  {name:'Kimwell Ablaza',       email:'kimwell@mycprteam.com',  role:'Dispute',     start:'2026-10-07', weekly:100, dept:'Dispute'},
  {name:'Annabel Curada',       email:'annabel@mycprteam.com',  role:'Dispute',     start:'2026-10-07', weekly:100, dept:'Dispute'},
  {name:'Bukunmi Aina',         email:'bukunmi@mycprteam.com',  role:'Lead Gen',    start:'2026-09-21', weekly:250, dept:'Lead Gen'},
  {name:'Fatima Charfina Caasi',email:'fcacaasi@gmail.com',     role:'Bureau',      start:'2026-10-12', weekly:100, dept:'Bureau'},
];

// Pay periods — bi-weekly, first week held
var PAY_PERIODS = [
  {payDate:'2026-10-09', workStart:'2026-09-21', workEnd:'2026-10-02', label:'Oct 9, 2026'},
  {payDate:'2026-10-23', workStart:'2026-10-05', workEnd:'2026-10-16', label:'Oct 23, 2026'},
  {payDate:'2026-11-06', workStart:'2026-10-19', workEnd:'2026-10-30', label:'Nov 6, 2026'},
  {payDate:'2026-11-20', workStart:'2026-11-02', workEnd:'2026-11-13', label:'Nov 20, 2026'},
  {payDate:'2026-12-04', workStart:'2026-11-16', workEnd:'2026-11-27', label:'Dec 4, 2026'},
  {payDate:'2026-12-18', workStart:'2026-11-30', workEnd:'2026-12-11', label:'Dec 18, 2026'},
];

function workDays(startStr, fromStr, toStr) {
  var start = new Date(startStr);
  var from  = new Date(fromStr);
  var to    = new Date(toStr);
  var begin = start > from ? start : from;
  if (begin > to) return 0;
  var days = 0;
  var d = new Date(begin);
  while (d <= to) {
    if (d.getDay() > 0 && d.getDay() < 6) days++;
    d.setDate(d.getDate()+1);
  }
  return days;
}

function isFirstPeriod(emp, period) {
  // First period where employee has any days
  var start = new Date(emp.start);
  var pStart = new Date(period.workStart);
  return start <= new Date(period.workEnd);
}

function calcPay(emp, period, bonuses) {
  var daily = emp.weekly / 5;
  var daysInPeriod = workDays(emp.start, period.workStart, period.workEnd);
  if (daysInPeriod === 0) return {base:0, bonus:0, total:0, held:false, days:0, note:'Not yet started'};

  // Is this the FIRST period the employee appears in?
  var prevPeriod = PAY_PERIODS.indexOf(period) > 0 ? PAY_PERIODS[PAY_PERIODS.indexOf(period)-1] : null;
  var hadPrevDays = prevPeriod ? workDays(emp.start, prevPeriod.workStart, prevPeriod.workEnd) > 0 : false;

  var held = !hadPrevDays; // First period = holding first 5 days
  var payableDays = held ? Math.max(0, daysInPeriod - 5) : daysInPeriod;
  var base = Math.round(daily * payableDays * 100) / 100;

  // Get bonus for this period from work_log
  var bonus = bonuses[emp.email] || 0;

  return {
    base: base,
    bonus: bonus,
    total: base + bonus,
    held: held,
    days: payableDays,
    note: held ? 'First week held ('+daysInPeriod+' days worked, 5 held)' : payableDays+' days × $'+daily.toFixed(2)
  };
}

var _bonuses = {};

var _hours = {};

async function loadHours(workStart, workEnd) {
  _hours = {};
  try {
    var r = await fetch(_SUPA+'/time_sessions?date=gte.'+workStart+'&date=lte.'+workEnd+'&status=eq.completed&select=employee_email,employee_name,active_hours,date',{headers:_HDR});
    var sessions = await r.json();
    if(!Array.isArray(sessions)) return;
    sessions.forEach(function(s) {
      var key = s.employee_email || s.employee_name;
      if(!key) return;
      if(!_hours[key]) _hours[key] = {hours:0, days:new Set()};
      _hours[key].hours += parseFloat(s.active_hours||0);
      _hours[key].days.add(s.date);
    });
    // Convert days Set to count and round hours
    Object.keys(_hours).forEach(function(k) {
      _hours[k].hours = Math.round(_hours[k].hours * 10) / 10;
      _hours[k].days = _hours[k].days.size;
    });
  } catch(e) { console.error('Load hours error:', e); }
}

async function loadBonuses(workStart, workEnd) {
  _bonuses = {};
  try {
    // Get bonuses from work_log for this period
    var r = await fetch(_SUPA+'/work_log?week_start=gte.'+workStart+'&week_start=lte.'+workEnd+'&compliance_status=eq.approved&select=employee_email,department,quantity,details',{headers:_HDR});
    var logs = await r.json();
    if (!Array.isArray(logs)) return;
    var counts = {};
    logs.forEach(function(l){
      var k=l.employee_email;
      if(!counts[k]) counts[k]={disputes:0,cs:0,bureau:0,revenue:0};
      if(l.department==='Dispute') counts[k].disputes+=(l.quantity||1);
      if(l.department==='CS') counts[k].cs+=(l.quantity||1);
      if(l.department==='Bureau') counts[k].bureau+=(l.quantity||1);
      if(l.department==='Sales'){
        var m=((l.details||'').match(/Amount:\s*\$?([\d.]+)/)||[,'0']);
        counts[k].revenue+=parseFloat(m[1])||0;
      }
    });
    Object.keys(counts).forEach(function(email){
      var c=counts[email];
      var b=0;
      if(c.disputes>=100) b+=50;
      else if(c.disputes>=50) b+=25;
      if(c.cs>=50) b+=25;
      if(c.bureau>=50) b+=25;
      b+=Math.round(c.revenue*0.10*100)/100;
      _bonuses[email]=b;
    });
  } catch(e) {}
}

async function showPeriod(view, btn) {
  document.querySelectorAll('.period-btn').forEach(function(b){b.classList.remove('active');});
  if(btn) btn.classList.add('active');

  var content = document.getElementById('payroll-content');
  var today = new Date();

  if (view === 'upcoming') {
    var upcoming = PAY_PERIODS.filter(function(p){return new Date(p.payDate)>=today;}).slice(0,3);
    var html = '';
    var nextTotal = 0;

    for (var pi=0; pi<upcoming.length; pi++) {
      var p = upcoming[pi];
      await loadHours(p.workStart, p.workEnd);
  await loadBonuses(p.workStart, p.workEnd);
      var periodTotal = 0; var periodBonus = 0;
      var rows = ROSTER.map(function(emp) {
        var pay = calcPay(emp, p, _bonuses);
        periodTotal += pay.total;
        periodBonus += pay.bonus;
        if (pay.total === 0 && !pay.held) return '';
        return '<tr class="'+(pay.held&&pay.base===0?'held':'')+'">'+
          '<td><strong>'+emp.name+'</strong><div class="daily-rate">$'+emp.weekly+'/wk — $'+(emp.weekly/5).toFixed(2)+'/day</div></td>'+
          '<td>'+emp.role+'</td>'+
          '<td class="base">$'+pay.base.toFixed(2)+'</td>'+
          '<td class="bonus">'+(pay.bonus>0?'+$'+pay.bonus.toFixed(2):'—')+'</td>'+
          '<td class="total-pay">$'+pay.total.toFixed(2)+'</td>'+
          '<td>'+(pay.held&&pay.base===0?'<span class="held-badge">⏳ First week held</span>':pay.note)+'</td>'+
        '</tr>';
      }).filter(Boolean);
      rows.push('<tr class="tr-total"><td colspan="2">TOTAL</td><td>—</td><td class="bonus">+$'+periodBonus.toFixed(2)+'</td><td>$'+periodTotal.toFixed(2)+'</td><td></td></tr>');
      if (pi===0) { nextTotal=periodTotal; }
      html += '<div class="payroll-card">'+
        '<div class="pc-header"><div><div class="pc-date">📅 '+p.label+'</div><div class="pc-period">Work period: '+p.workStart+' to '+p.workEnd+'</div></div><div class="pc-total">$'+periodTotal.toFixed(2)+'</div></div>'+
        '<table><thead><tr><th>Employee</th><th>Role</th><th>Hours</th><th>Days</th><th>Base Pay</th><th>Bonus</th><th>Total</th><th>Notes</th></tr></thead><tbody>'+rows.join('')+'</tbody></table></div>';
    }
    content.innerHTML = html;
    document.getElementById('s-next').textContent='$'+nextTotal.toFixed(2);
    document.getElementById('s-next-date').textContent=upcoming.length?upcoming[0].label:'—';
    var tb=Object.values(_bonuses).reduce(function(s,v){return s+v;},0);
    document.getElementById('s-total-bonus').textContent='$'+tb.toFixed(2);

  } else if (view === 'history') {
    var past = PAY_PERIODS.filter(function(p){return new Date(p.payDate)<today;});
    if (!past.length) { content.innerHTML='<div style="text-align:center;padding:32px;color:#94A3B8;">No past pay dates yet.</div>'; return; }
    var html='';
    for(var pi=0; pi<past.length; pi++){
      var p=past[pi];
      await loadBonuses(p.workStart, p.workEnd);
      var periodTotal=0;
      var rows=ROSTER.map(function(emp){
        var pay=calcPay(emp,p,_bonuses);
        periodTotal+=pay.total;
        if(pay.total===0) return '';
        return '<tr><td><strong>'+emp.name+'</strong></td><td>'+emp.role+'</td>'+
          '<td class="base">$'+pay.base.toFixed(2)+'</td>'+
          '<td class="bonus">'+(pay.bonus>0?'+$'+pay.bonus.toFixed(2):'—')+'</td>'+
          '<td class="total-pay">$'+pay.total.toFixed(2)+'</td>'+
          '<td><span class="paid-badge">✅ Paid</span></td></tr>';
      }).filter(Boolean);
      rows.push('<tr class="tr-total"><td colspan="4">TOTAL PAID</td><td>$'+periodTotal.toFixed(2)+'</td><td></td></tr>');
      html+='<div class="payroll-card">'+
        '<div class="pc-header"><div><div class="pc-date">📅 '+p.label+'</div><div class="pc-period">Work period: '+p.workStart+' to '+p.workEnd+'</div></div><div class="pc-total">$'+periodTotal.toFixed(2)+'</div></div>'+
        '<table><thead><tr><th>Employee</th><th>Role</th><th>Base</th><th>Bonus</th><th>Total Paid</th><th>Status</th></tr></thead><tbody>'+rows.join('')+'</tbody></table></div>';
    }
    content.innerHTML=html;
  } else {
    content.innerHTML='<div style="background:white;border-radius:12px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,.05);">'+
      '<h3 style="font-size:15px;font-weight:800;margin-bottom:12px;color:#DC2626;">⚠️ Deduction Rules</h3>'+
      '<p style="font-size:13px;color:#374151;margin-bottom:10px;">Daily rate = Weekly pay ÷ 5. Each missed day deducts that amount from the next paycheck.</p>'+
      '<table><thead><tr><th>Employee</th><th>Weekly Pay</th><th>Daily Rate</th><th>1 Day Off Cost</th></tr></thead><tbody>'+
      ROSTER.map(function(e){return '<tr><td>'+e.name+'</td><td>$'+e.weekly+'</td><td>$'+(e.weekly/5).toFixed(2)+'</td><td class="deduct-note">-$'+(e.weekly/5).toFixed(2)+'</td></tr>';}).join('')+
      '</tbody></table></div>';
  }
}

// Init
showPeriod('upcoming', null);
</script>
</body>
</html>
