<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSR Call Queue</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F8FAFC;color:#1E293B;}
header{background:#8B1A1A;padding:14px 20px;display:flex;align-items:center;gap:12px;}
header img{height:30px;filter:brightness(0) invert(1);}
header h1{color:white;font-size:15px;font-weight:800;flex:1;}
header a{color:rgba(255,255,255,.75);font-size:12px;text-decoration:none;margin-left:10px;}
.wrap{max-width:1000px;margin:0 auto;padding:20px;}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-bottom:20px;}
.stat{background:white;border-radius:10px;border:1.5px solid #E2E8F0;padding:14px;text-align:center;}
.sv{font-size:28px;font-weight:800;}.sl{font-size:11px;color:#64748B;margin-top:3px;font-weight:600;text-transform:uppercase;}
.sv.red{color:#8B1A1A;}.sv.gold{color:#92400E;}.sv.blue{color:#1B3A6B;}.sv.green{color:#166534;}
.add-card{background:white;border-radius:12px;border:2px solid #8B1A1A;padding:20px;margin-bottom:20px;}
.add-card h2{font-size:14px;font-weight:800;color:#8B1A1A;margin-bottom:14px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
@media(max-width:600px){.row2{grid-template-columns:1fr;}}
input,select,textarea{width:100%;padding:10px;border:1.5px solid #E2E8F0;border-radius:8px;font-size:13px;font-family:inherit;}
textarea{resize:vertical;}
.btn-red{background:#8B1A1A;color:white;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;width:100%;font-family:inherit;}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.fb{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;border:2px solid #E2E8F0;background:white;color:#64748B;}
.fb.active{background:#8B1A1A;color:white;border-color:#8B1A1A;}
.queue{display:grid;gap:12px;}
.card{background:white;border-radius:12px;border:1.5px solid #E2E8F0;padding:16px;}
.card.urgent{border-left:5px solid #8B1A1A;}
.card.high{border-left:5px solid #F59E0B;}
.card.normal{border-left:5px solid #1B3A6B;}
.card.called{opacity:.7;border-left:5px solid #166534;}
.card.resolved{opacity:.4;}
.ctop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.cname{font-size:16px;font-weight:800;color:#1B3A6B;}
.cmeta{font-size:12px;color:#64748B;margin-top:3px;line-height:1.9;}
.cmeta a{color:#1B3A6B;font-weight:700;text-decoration:none;}
.reason{padding:10px 12px;border-radius:6px;font-size:13px;line-height:1.6;margin:10px 0;border-left:3px solid #8B1A1A;background:#FEF2F2;color:#7F1D1D;}
.reason.high{background:#FEF9C3;color:#78350F;border-color:#F59E0B;}
.reason.normal{background:#EFF6FF;color:#1E3A5F;border-color:#1B3A6B;}
.notes-box{background:#F0F4FF;border-left:3px solid #1B3A6B;border-radius:0 6px 6px 0;padding:10px 12px;font-size:13px;color:#1E293B;margin-bottom:10px;line-height:1.6;}
.outcome-area{margin:10px 0;}
.outcome-area label{font-size:12px;font-weight:700;color:#1B3A6B;display:block;margin-bottom:4px;}
.outcome-area textarea{min-height:60px;border-color:#C7D7F5;font-size:12px;}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.btn{padding:8px 14px;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-call{background:#8B1A1A;color:white;text-decoration:none;display:inline-block;}
.btn-called{background:#166534;color:white;}
.btn-resolve{background:#64748B;color:white;}
.btn-view{background:#F1F5F9;color:#475569;border:1.5px solid #E2E8F0;text-decoration:none;display:inline-block;}
.badge{display:inline-block;padding:3px 10px;border-radius:4px;font-size:11px;font-weight:700;}
.b-urgent{background:#FEE2E2;color:#8B1A1A;}
.b-high{background:#FEF9C3;color:#92400E;}
.b-normal{background:#DBEAFE;color:#1E40AF;}
.b-called{background:#DCFCE7;color:#166534;}
.b-resolved{background:#F1F5F9;color:#64748B;}
.ago{font-size:11px;color:#94A3B8;}
.empty{text-align:center;padding:60px 20px;color:#94A3B8;}
.empty .ico{font-size:48px;margin-bottom:12px;}
#add-msg{font-size:12px;text-align:center;margin-top:8px;min-height:16px;}
</style>
<!-- Meta Pixel Code -->
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}(window, document,'script',
'https://connect.facebook.net/en_US/fbevents.js');

src="https://www.facebook.com/tr?id=1584028236255374&ev=PageView&noscript=1"

</head>
<body>
<header>
  <img src="/images/logo.png" alt="CP Restoration">
  <h1>&#128222; CSR Call Queue &mdash; Urgent Callbacks</h1>
  <a href="/dashboard.html">&larr; Back</a>
  <a href="/requests-inbox.html">Requests Inbox</a>
</header>

<div class="wrap">

  <!-- ADD FORM -->
  <div class="add-card">
    <h2>&#43; Add Client to Call Queue</h2>
    <div class="row2">
      <input id="cq-name" placeholder="Client Full Name *" type="text">
      <input id="cq-id" placeholder="Client ID (e.g. CPR-CP17430)" type="text">
    </div>
    <div class="row2">
      <input id="cq-phone" placeholder="Phone Number *" type="tel">
      <input id="cq-email" placeholder="Email Address" type="email">
    </div>
    <div class="row2">
      <select id="cq-priority">
        <option value="urgent">&#128308; URGENT &mdash; Call within 1 hour</option>
        <option value="high">&#128993; HIGH &mdash; Call today</option>
        <option value="normal">&#128309; NORMAL &mdash; Call this week</option>
      </select>
      <select id="cq-rep">
        <option value="Any Available">Assign to: Any Available Rep</option>
        <option value="Elna Palabrica">Elna Palabrica</option>
        <option value="Jonah De Guzman">Jonah De Guzman</option>
        <option value="Alec Sarrosa">Alec Sarrosa</option>
        <option value="Anthon Sumbiling">Anthon Sumbiling</option>
      </select>
    </div>
    <textarea id="cq-reason" placeholder="Reason for call * (what did the client email / what is the issue?)" style="min-height:70px;margin-bottom:10px;"></textarea>
    <textarea id="cq-notes" placeholder="Notes for the CS rep &mdash; background context, what to say, what to avoid, any history with this client..." style="min-height:80px;margin-bottom:10px;border-color:#1B3A6B;"></textarea>
    <button class="btn-red" onclick="addToQueue()">&#128222; Add to Call Queue</button>
    <div id="add-msg"></div>
  </div>

  <!-- STATS -->
  <div class="stats">
    <div class="stat"><div class="sv red" id="ct-urgent">0</div><div class="sl">Urgent</div></div>
    <div class="stat"><div class="sv gold" id="ct-high">0</div><div class="sl">High</div></div>
    <div class="stat"><div class="sv blue" id="ct-normal">0</div><div class="sl">Normal</div></div>
    <div class="stat"><div class="sv green" id="ct-done">0</div><div class="sl">Done Today</div></div>
  </div>

  <!-- FILTERS -->
  <div class="filters">
    <button class="fb active" data-f="pending">All Pending</button>
    <button class="fb" data-f="urgent">&#128308; Urgent</button>
    <button class="fb" data-f="high">&#128993; High</button>
    <button class="fb" data-f="normal">&#128309; Normal</button>
    <button class="fb" data-f="called">&#9989; Called</button>
    <button class="fb" data-f="all" style="margin-left:auto;">All</button>
    <button class="fb" onclick="load()">&#8635; Refresh</button>
  </div>

  <!-- QUEUE -->
  <div class="queue" id="queue">
    <div class="empty"><div class="ico">&#128222;</div>Loading...</div>
  </div>

</div>

<script>
var SUPA = 'https://jzkfembagpiuuoexmpoy.supabase.co/rest/v1';
var KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6a2ZlbWJhZ3BpdXVvZXhtcG95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NzYwNjEsImV4cCI6MjEwNjM1MjA2MX0.8euoI8CGkr3GBFiTrlaEmO8DtVyCF9jVaWPGORScg50';
var HDR  = {apikey:KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'};
var all  = [];
var filt = 'pending';

async function addToQueue() {
  var name   = document.getElementById('cq-name').value.trim();
  var phone  = document.getElementById('cq-phone').value.trim();
  var reason = document.getElementById('cq-reason').value.trim();
  var notes  = document.getElementById('cq-notes').value.trim();
  var msg    = document.getElementById('add-msg');
  if (!name||!phone||!reason) { msg.style.color='#8B1A1A'; msg.textContent='Name, phone and reason are required.'; return; }
  msg.style.color='#64748B'; msg.textContent='Saving...';
  try {
    var r = await fetch(SUPA+'/requests', {
      method:'POST',
      headers:Object.assign({},HDR,{Prefer:'return=minimal'}),
      body:JSON.stringify({
        type:'call_queue',
        client_name:name,
        client_id:document.getElementById('cq-id').value.trim()||null,
        client_phone:phone,
        client_email:document.getElementById('cq-email').value.trim()||null,
        priority:document.getElementById('cq-priority').value,
        assigned_to:document.getElementById('cq-rep').value,
        reason:reason,
        notes:notes,
        status:'pending',
        created_at:new Date().toISOString()
      })
    });
    if (r.ok) {
      msg.style.color='#166534'; msg.textContent='Added to call queue!';
      ['cq-name','cq-id','cq-phone','cq-email','cq-reason','cq-notes'].forEach(function(id){document.getElementById(id).value='';});
      setTimeout(function(){msg.textContent='';load();},1500);
    } else { msg.style.color='#8B1A1A'; msg.textContent='Error. Try again.'; }
  } catch(e){ msg.style.color='#8B1A1A'; msg.textContent='Error: '+e.message; }
}

async function load() {
  try {
    var r = await fetch(SUPA+'/requests?type=eq.call_queue&order=created_at.desc&limit=200',{headers:HDR});
    all = await r.json();
    if (!Array.isArray(all)) all=[];
    counts(); render();
  } catch(e){ console.error(e); }
}

function counts() {
  var today = new Date().toDateString();
  document.getElementById('ct-urgent').textContent = all.filter(function(i){return i.priority==='urgent'&&i.status==='pending';}).length;
  document.getElementById('ct-high').textContent   = all.filter(function(i){return i.priority==='high'&&i.status==='pending';}).length;
  document.getElementById('ct-normal').textContent = all.filter(function(i){return i.priority==='normal'&&i.status==='pending';}).length;
  document.getElementById('ct-done').textContent   = all.filter(function(i){return (i.status==='resolved'||i.status==='called')&&new Date(i.created_at).toDateString()===today;}).length;
}

function render() {
  var items = all.filter(function(i){
    if (filt==='urgent') return i.priority==='urgent'&&i.status==='pending';
    if (filt==='high')   return i.priority==='high'&&i.status==='pending';
    if (filt==='normal') return i.priority==='normal'&&i.status==='pending';
    if (filt==='called') return i.status==='called';
    if (filt==='all')    return true;
    return i.status==='pending'||i.status==='called'; // pending
  });
  var ord = {urgent:0,high:1,normal:2};
  items.sort(function(a,b){ var p=(ord[a.priority]||2)-(ord[b.priority]||2); return p!==0?p:new Date(a.created_at)-new Date(b.created_at); });

  var q = document.getElementById('queue');
  if (!items.length) { q.innerHTML='<div class="empty"><div class="ico">&#9989;</div><div>No items in this queue.</div></div>'; return; }

  var pLabel = {urgent:'&#128308; URGENT',high:'&#128993; HIGH',normal:'&#128309; NORMAL'};
  var pBadge = {urgent:'b-urgent',high:'b-high',normal:'b-normal'};
  var rClass = {urgent:'',high:'high',normal:'normal'};
  var sBadge = {called:'<span class="badge b-called" style="margin-left:6px;">CALLED</span>',resolved:'<span class="badge b-resolved" style="margin-left:6px;">RESOLVED</span>'};

  q.innerHTML = items.map(function(item) {
    var ago = timeAgo(item.created_at);
    return '<div class="card '+item.priority+' '+item.status+'" data-id="'+item.id+'">' +
      '<div class="ctop">' +
        '<div>' +
          '<div class="cname">'+esc(item.client_name||'Unknown')+'</div>' +
          '<div class="cmeta">' +
            (item.client_id?'ID: '+item.client_id+'<br>':'') +
            (item.client_phone?'<a href="tel:'+item.client_phone+'">&#128222; '+item.client_phone+'</a><br>':'') +
            (item.client_email?'<a href="mailto:'+item.client_email+'">&#9993; '+item.client_email+'</a><br>':'') +
            '<span style="color:#1B3A6B;font-weight:700;">Assigned: '+(item.assigned_to||'Any')+'</span>' +
          '</div>' +
        '</div>' +
        '<div style="text-align:right;">' +
          '<span class="badge '+(pBadge[item.priority]||'b-normal')+'">'+(pLabel[item.priority]||'NORMAL')+'</span>' +
          (sBadge[item.status]||'') + '<br>' +
          '<span class="ago">'+ago+'</span>' +
        '</div>' +
      '</div>' +
      '<div class="reason '+(rClass[item.priority]||'normal')+'">' +
        '<strong>&#128203; Reason:</strong><br>' + esc(item.reason||'No reason provided') +
      '</div>' +
      (item.notes ? '<div class="notes-box"><strong style="color:#1B3A6B;">&#128221; Notes for CS Rep:</strong><br>'+esc(item.notes).replace(/\n/g,'<br>')+'</div>' : '') +
      '<div class="outcome-area">' +
        '<label>&#9998; Call Outcome Notes (fill in after the call):</label>' +
        '<textarea class="outcome-ta" data-id="'+item.id+'" placeholder="What happened on the call? What did the client say? Next steps?">'+(esc(item.outcome_notes||''))+'</textarea>' +
      '</div>' +
      '<div class="actions">' +
        (item.client_phone?'<a href="tel:'+item.client_phone+'" class="btn btn-call">&#128222; Call Now</a>':'') +
        '<button class="btn btn-called ms-btn" data-id="'+item.id+'" data-status="called">&#9989; Mark Called</button>' +
        '<button class="btn btn-resolve ms-btn" data-id="'+item.id+'" data-status="resolved">&#10003; Resolve</button>' +
        (item.client_id?'<a href="/cs-dashboard.html?client='+item.client_id+'" target="_blank" class="btn btn-view">&#128269; View File</a>':'') +
      '</div>' +
    '</div>';
  }).join('');

  // Wire events
  document.querySelectorAll('.ms-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      markStatus(this.getAttribute('data-id'), this.getAttribute('data-status'));
    });
  });
  document.querySelectorAll('.outcome-ta').forEach(function(ta) {
    ta.addEventListener('change', function() {
      saveNote(this.getAttribute('data-id'), this.value);
    });
  });
}

async function markStatus(id, status) {
  try {
    await fetch(SUPA+'/requests?id=eq.'+id, {
      method:'PATCH',
      headers:Object.assign({},HDR,{Prefer:'return=minimal'}),
      body:JSON.stringify({status:status})
    });
    var item = all.find(function(i){return String(i.id)===String(id);});
    if (item) item.status = status;
    counts(); render();
  } catch(e){ console.error(e); }
}

async function saveNote(id, note) {
  // Save note to the requests table — try outcome_notes first, fallback to notes field
  try {
    var r1 = await fetch(SUPA+'/requests?id=eq.'+id, {
      method:'PATCH',
      headers:Object.assign({},HDR,{Prefer:'return=minimal'}),
      body:JSON.stringify({notes:note, outcome_notes:note, updated_at:new Date().toISOString()})
    });
    if (!r1.ok) console.warn('saveNote HTTP '+r1.status);
  } catch(e){ console.error('saveNote error:', e); }
}

function timeAgo(ts) {
  if (!ts) return '';
  var s = Math.round((Date.now()-new Date(ts))/1000);
  if (s<60) return s+'s ago';
  if (s<3600) return Math.floor(s/60)+'m ago';
  if (s<86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Filter buttons
document.querySelectorAll('.fb[data-f]').forEach(function(btn) {
  btn.addEventListener('click', function() {
    filt = this.getAttribute('data-f');
    document.querySelectorAll('.fb').forEach(function(b){b.classList.remove('active');});
    this.classList.add('active');
    render();
  });
});

document.addEventListener('DOMContentLoaded', load);
setInterval(load, 30000);
</script>
</body>
</html>
