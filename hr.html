<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR — Employee Onboarding | CP Restoration</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:#F8FAFC;color:#1E293B;}
header{background:#1B3A6B;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;}
header h1{color:white;font-size:18px;font-weight:800;}
header a{color:rgba(255,255,255,0.7);font-size:12px;text-decoration:none;}
.container{max-width:1100px;margin:24px auto;padding:0 20px;}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px;}
.stat{background:white;border-radius:12px;border:1.5px solid #E2E8F0;padding:16px;text-align:center;}
.stat .val{font-size:32px;font-weight:800;color:#1B3A6B;}
.stat .lbl{font-size:11px;color:#64748B;margin-top:4px;text-transform:uppercase;letter-spacing:0.5px;}
.card{background:white;border-radius:12px;border:1.5px solid #E2E8F0;padding:20px;margin-bottom:20px;}
.card h2{font-size:15px;font-weight:700;color:#1B3A6B;margin-bottom:16px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:#1B3A6B;color:white;padding:10px 12px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;}
td{padding:10px 12px;border-bottom:1px solid #E2E8F0;vertical-align:top;}
tr:hover td{background:#F1F5F9;}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.badge-green{background:#DCFCE7;color:#166534;}
.badge-gold{background:#FEF9C3;color:#854D0E;}
.detail-btn{padding:4px 10px;background:#1B3A6B;color:white;border:none;border-radius:5px;font-size:11px;cursor:pointer;}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:999;display:flex;align-items:center;justify-content:center;}
.modal-box{background:white;border-radius:14px;padding:28px;max-width:600px;width:90%;max-height:85vh;overflow-y:auto;}
.modal-box h2{font-size:16px;font-weight:800;color:#1B3A6B;margin-bottom:16px;}
.field{margin-bottom:10px;font-size:13px;}
.field label{font-weight:600;color:#475569;display:block;font-size:11px;margin-bottom:2px;}
.field span{color:#1E293B;}
.close-btn{margin-top:16px;padding:8px 20px;background:#1B3A6B;color:white;border:none;border-radius:7px;cursor:pointer;font-weight:600;}
.tab-btn{padding:10px 20px;border:none;background:transparent;color:rgba(255,255,255,0.6);font-size:13px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;}
.tab-btn.active{color:white;border-bottom:3px solid #C9A84C;}
.tab-content{display:none;} .tab-content.active{display:block;}
.pass-badge{background:#DCFCE7;color:#166534;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.fail-badge{background:#FEE2E2;color:#991B1B;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.progress-bar-wrap{background:#E2E8F0;border-radius:4px;height:8px;width:100px;display:inline-block;vertical-align:middle;}
.progress-bar-fill{height:8px;border-radius:4px;background:#166534;}
</style>

</head>
<body>
<header>
  <h1>&#128101; HR Management — <img src="/images/logo.png" alt="CP Restoration Services" style="height:36px;width:auto;vertical-align:middle;margin-right:10px;">CP Restoration Services</h1>
  <a href="/dashboard.html" style="color:rgba(255,255,255,0.7);font-size:12px;text-decoration:none;">← Back to Dashboard</a>
</header>
<div style="background:#1E3A5F;padding:0 24px;display:flex;gap:4px;">
  <button class="tab-btn active" id="tab-onboarding" onclick="showTab('onboarding')">&#128203; Onboarding</button>
  <button class="tab-btn" id="tab-training" onclick="showTab('training')">&#127891; Training Results</button>
</div>
<div class="container">
<div id="tab-onboarding-content" class="tab-content active">
  <div class="summary" id="summary"></div>
  <div class="card">
    <h2>&#128203; All Submissions</h2>
    <table>
      <thead><tr><th>Name</th><th>Work Email</th><th>Phone</th><th>Timezone</th><th>Payment</th><th>Submitted</th><th></th></tr></thead>
      <tbody id="tbl-body"></tbody>
    </table>
  </div>
</div>
</div><!-- end onboarding tab -->

<div id="tab-training-content" class="tab-content">
<div class="container">
  <div class="summary" id="training-summary"></div>
  <div class="card">
    <h2>&#127891; Training Quiz Results — All Employees</h2>
    <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;">
      <select id="tr-filter-dept" onchange="loadTraining()" style="padding:8px 12px;border:1.5px solid #E2E8F0;border-radius:7px;font-size:13px;">
        <option value="all">All Departments</option>
        <option value="cs">CS Agents</option>
        <option value="compliance">Compliance</option>
        <option value="sales">Sales</option>
      </select>
      <select id="tr-filter-status" onchange="loadTraining()" style="padding:8px 12px;border:1.5px solid #E2E8F0;border-radius:7px;font-size:13px;">
        <option value="all">All Results</option>
        <option value="passed">Passed Only</option>
        <option value="failed">Failed Only</option>
      </select>
      <button onclick="loadTraining()" style="padding:8px 16px;background:#1B3A6B;color:white;border:none;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;">&#8635; Refresh</button>
    </div>
    <table>
      <thead><tr><th>Employee</th><th>Email</th><th>Score</th><th>Result</th><th>Attempts</th><th>Last Taken</th></tr></thead>
      <tbody id="training-body"></tbody>
    </table>
  </div>
</div>
</div><!-- end training tab -->

<div id="modal" style="display:none;" class="modal" onclick="closeModal()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <h2 id="m-name"></h2>
    <div id="m-body"></div>
    <button class="close-btn" onclick="closeModal()">Close</button>
  </div>
</div>
<script>
var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6a2ZlbWJhZ3BpdXVvZXhtcG95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NzYwNjEsImV4cCI6MjEwNjM1MjA2MX0.8euoI8CGkr3GBFiTrlaEmO8DtVyCF9jVaWPGORScg50';
var SUPA = 'https://jzkfembagpiuuoexmpoy.supabase.co/rest/v1';
var allData = [];

async function load() {
  try {
    var r = await fetch(SUPA+'/employee_onboarding?limit=500', {
      headers:{'apikey':KEY,'Authorization':'Bearer '+KEY}
    });
    var raw = await r.json();
    if (Array.isArray(raw)) {
      allData = raw;
    } else {
      console.error('HR load error:', raw);
      allData = [];
    }
    // Sort by any date field found
    allData.sort(function(a,b){
      var da = a.submittedAt||a.submitted_at||a.created_at||'';
      var db = b.submittedAt||b.submitted_at||b.created_at||'';
      return db.localeCompare(da);
    });
    render();
  } catch(e) {
    document.getElementById('tbl-body').innerHTML = '<tr><td colspan="7" style="text-align:center;padding:24px;color:#64748B;">Error loading data: '+e.message+'</td></tr>';
  }
}

function render() {
  // Summary
  document.getElementById('summary').innerHTML =
    '<div class="stat"><div class="val">'+allData.length+'</div><div class="lbl">Total Submissions</div></div>'+
    '<div class="stat"><div class="val" style="color:#166534;">'+allData.filter(function(d){return d.workEmail||d.work_email;}).length+'</div><div class="lbl">With Work Email</div></div>'+
    '<div class="stat"><div class="val" style="color:#C9A84C;">'+allData.filter(function(d){return d.paymentMethod||d.payment_method;}).length+'</div><div class="lbl">Payment On File</div></div>';

  // Table
  if (!allData.length) {
    document.getElementById('tbl-body').innerHTML = '<tr><td colspan="7" style="text-align:center;padding:32px;color:#64748B;">No submissions yet.</td></tr>';
    return;
  }
  document.getElementById('tbl-body').innerHTML = allData.map(function(d,i) {
    var name = (d.firstName||'') + ' ' + (d.lastName||'');
    var ts = '';
    try { ts = new Date(d.submittedAt).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); } catch(e){}
    return '<tr>'+
      '<td><strong>'+name.trim()+'</strong></td>'+
      '<td>'+(d.workEmail||'—')+'</td>'+
      '<td>'+(d.phone||'—')+'</td>'+
      '<td>'+(d.timezone||'—')+'</td>'+
      '<td><span class="badge badge-'+(d.paymentMethod?'green':'gold')+'">'+((d.paymentMethod||'Not provided'))+'</span></td>'+
      '<td>'+ts+'</td>'+
      '<td><button class="detail-btn" onclick="showDetail('+i+')">View</button></td>'+
    '</tr>';
  }).join('');
}

function showDetail(i) {
  var d = allData[i];
  document.getElementById('m-name').textContent = (d.firstName||'') + ' ' + (d.lastName||'');
  document.getElementById('m-body').innerHTML =
    field('Work Email', d.workEmail) +
    field('Personal Email', d.email) +
    field('Phone', d.phone) +
    field('Timezone', d.timezone) +
    field('Address', d.address) +
    field('Emergency Contact', (d.ecName||'') + ' — ' + (d.ecPhone||'')) +
    field('Internet Speed', d.internetSpeed) +
    field('Payment Method', d.paymentMethod) +
    field('Payment Info', d.paymentInfo) +
    field('How They Found Us', d.source) +
    field('Date of Birth', d.dob) +
    field('ID Type', d.idType) +
    field('ID File', d.idFileName) +
    (d.idCard ? '<div class="field"><label>ID Card</label><img src="'+d.idCard+'" style="max-width:100%;max-height:300px;border-radius:8px;border:1.5px solid #E2E8F0;margin-top:4px;"></div>' : field('ID Card', 'Not uploaded')) +
    field('Comments', d.comments) +
    field('Submitted', d.submittedAt ? new Date(d.submittedAt).toLocaleString() : '—');
  document.getElementById('modal').style.display = 'flex';
}

function field(label, val) {
  return '<div class="field"><label>'+label+'</label><span>'+(val||'—')+'</span></div>';
}

function closeModal() {
  document.getElementById('modal').style.display = 'none';
}


function showTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(function(b){b.className='tab-btn';});
  document.querySelectorAll('.tab-content').forEach(function(c){c.className='tab-content';});
  document.getElementById('tab-'+tab).className='tab-btn active';
  document.getElementById('tab-'+tab+'-content').className='tab-content active';
  if(tab==='training') loadTraining();
}

var trainingData = [];
async function loadTraining() {
  var statusFilter = document.getElementById('tr-filter-status').value;
  try {
    var r = await fetch('https://jzkfembagpiuuoexmpoy.supabase.co/rest/v1/training_results?order=completed_at.desc&limit=500', {
      headers:{'apikey':'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6a2ZlbWJhZ3BpdXVvZXhtcG95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NzYwNjEsImV4cCI6MjEwNjM1MjA2MX0.8euoI8CGkr3GBFiTrlaEmO8DtVyCF9jVaWPGORScg50','Authorization':'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6a2ZlbWJhZ3BpdXVvZXhtcG95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NzYwNjEsImV4cCI6MjEwNjM1MjA2MX0.8euoI8CGkr3GBFiTrlaEmO8DtVyCF9jVaWPGORScg50'}
    });
    var raw = await r.json();
    if (!Array.isArray(raw)) return;

    // Group by email — keep best score per person
    var byEmail = {};
    raw.forEach(function(r) {
      var key = r.work_email || r.employee_name;
      if (!byEmail[key]) byEmail[key] = {attempts:0, best:null, latest:null};
      byEmail[key].attempts++;
      if (!byEmail[key].best || r.percentage > byEmail[key].best.percentage) byEmail[key].best = r;
      if (!byEmail[key].latest || new Date(r.completed_at) > new Date(byEmail[key].latest.completed_at)) byEmail[key].latest = r;
    });

    trainingData = Object.values(byEmail);
    if (statusFilter === 'passed') trainingData = trainingData.filter(function(d){return d.best.passed;});
    if (statusFilter === 'failed') trainingData = trainingData.filter(function(d){return !d.best.passed;});

    // Summary
    var total = trainingData.length;
    var passed = trainingData.filter(function(d){return d.best.passed;}).length;
    var failed = total - passed;
    document.getElementById('training-summary').innerHTML =
      '<div class="stat"><div class="val">'+total+'</div><div class="lbl">Total Employees Tested</div></div>'+
      '<div class="stat"><div class="val" style="color:#166534;">'+passed+'</div><div class="lbl">Passed (80%+)</div></div>'+
      '<div class="stat"><div class="val" style="color:#8B1A1A;">'+failed+'</div><div class="lbl">Need to Retake</div></div>';

    // Table
    var tbody = document.getElementById('training-body');
    if (!trainingData.length) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:24px;color:#64748B;">No results yet.</td></tr>';
      return;
    }
    tbody.innerHTML = trainingData.map(function(d) {
      var b = d.best;
      var ts = '';
      try { ts = new Date(d.latest.completed_at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); } catch(e){}
      var pct = b.percentage || 0;
      return '<tr>'+
        '<td><strong>'+b.employee_name+'</strong></td>'+
        '<td>'+(b.work_email||'—')+'</td>'+
        '<td>'+
          '<div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:'+Math.min(pct,100)+'%;background:'+(b.passed?'#166534':'#DC2626')+'"></div></div>'+
          ' <strong>'+b.score+'/'+b.total+' ('+pct+'%)</strong>'+
        '</td>'+
        '<td>'+(b.passed?'<span class="pass-badge">✅ PASSED</span>':'<span class="fail-badge">❌ FAILED</span>')+'</td>'+
        '<td style="text-align:center;">'+d.attempts+'</td>'+
        '<td>'+ts+'</td>'+
      '</tr>';
    }).join('');
  } catch(e) { console.log('Training load error:', e); }
}

load();

document.addEventListener('DOMContentLoaded', function() {
  // Load onboarding submissions first (default tab)
  if (typeof loadSubmissions === 'function') loadSubmissions();
  else if (typeof loadOnboarding === 'function') loadOnboarding();
  else if (typeof init === 'function') init();

  // Also pre-load training results
  if (typeof loadTrainingResults === 'function') loadTrainingResults();
  else if (typeof loadTraining === 'function') loadTraining();
});

</script>
</body>
</html>
