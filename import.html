<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Verify Supabase</title>
<style>body{font-family:Arial,sans-serif;background:#F8FAFC;padding:30px;} .card{background:white;border-radius:12px;padding:24px;max-width:600px;margin:0 auto;box-shadow:0 2px 12px rgba(0,0,0,.07);} h2{color:#1B3A6B;margin-bottom:16px;} .btn{padding:12px 24px;border-radius:8px;border:none;font-size:14px;font-weight:700;cursor:pointer;margin:6px 6px 6px 0;} .btn-navy{background:#1B3A6B;color:white;} .btn-green{background:#166534;color:white;} #log{background:#0F172A;color:#94A3B8;border-radius:8px;padding:14px;height:300px;overflow-y:auto;font-size:12px;font-family:monospace;margin-top:14px;}</style>
</head>
<body>
<div class="card">
  <h2>&#128270; Supabase Verification</h2>
  <button class="btn btn-navy" onclick="verify()">&#9654; Check Des Ann in Supabase</button>
  <button class="btn btn-navy" onclick="countAll()">Count All Clients</button>
  <button class="btn btn-green" onclick="window.location='/client-manager.html'">&#8594; Client Manager</button>
  <div id="log">Ready.
</div>
</div>
<script>
var SUPA = 'https://jzkfembagpiuuoexmpoy.supabase.co/rest/v1/clients';
var KEY = ['eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6a2ZlbWJhZ3BpdXVvZXhtcG95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NzYwNjEsImV4cCI6MjEwNjM1MjA2MX0','8euoI8CGkr3GBFiTrlaEmO8DtVyCF9jVaWPGORScg50'].join('.');
var H = {'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY};

function log(msg,c){var el=document.getElementById('log');var d=document.createElement('div');d.style.color=c||'#94A3B8';d.textContent='['+new Date().toLocaleTimeString()+'] '+msg;el.appendChild(d);el.scrollTop=el.scrollHeight;}

async function verify(){
  log('Searching Supabase for Des Ann...','#60A5FA');
  try{
    // Search by ID
    var r1=await fetch(SUPA+'?id=eq.CPR-00380',{headers:H});
    var d1=await r1.json();
    log('By ID CPR-00380: '+JSON.stringify(d1),'#4ADE80');

    // Search by name
    var r2=await fetch(SUPA+'?name=ilike.*Des*Ann*&limit=5',{headers:H});
    var d2=await r2.json();
    log('By name "Des Ann": '+JSON.stringify(d2),'#4ADE80');

    // Search by name variant
    var r3=await fetch(SUPA+'?name=ilike.*johnson*&limit=5',{headers:H});
    var d3=await r3.json();
    log('By name "johnson" (first 5): '+JSON.stringify(d3.slice(0,3)),'#4ADE80');
  }catch(e){log('Error: '+e.message,'#F87171');}
}

async function countAll(){
  try{
    var r=await fetch(SUPA+'?select=id',{headers:Object.assign({},H,{'Prefer':'count=exact'})});
    var count=r.headers.get('content-range');
    var data=await r.json();
    log('Total clients in Supabase: '+(count||data.length),'#4ADE80');
  }catch(e){log('Error: '+e.message,'#F87171');}
}
</script>
</body>
</html>
