<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Create Disputes Table</title>
<style>body{font-family:Arial,sans-serif;padding:30px;background:#F8FAFC;} .card{background:white;padding:24px;border-radius:12px;max-width:560px;margin:0 auto;box-shadow:0 2px 12px rgba(0,0,0,.07);} h2{color:#1B3A6B;margin-bottom:8px;} .sub{font-size:13px;color:#64748B;margin-bottom:16px;} .btn{padding:12px 24px;border-radius:8px;border:none;font-size:14px;font-weight:700;cursor:pointer;margin:6px 6px 6px 0;} .btn-navy{background:#1B3A6B;color:white;} .btn-green{background:#166534;color:white;} #st{margin-top:16px;font-size:13px;font-weight:600;}</style>
</head><body>
<div class="card">
  <h2>&#128293; Create Disputes Table in Supabase</h2>
  <div class="sub">One-time setup — creates the disputes table so the Dispute Activity Log works permanently.</div>
  <button class="btn btn-navy" onclick="createTable()">&#9654; Create Table & Test Insert</button>
  <button class="btn btn-green" onclick="window.location='/dispute-center.html'">&#8594; Dispute Center</button>
  <div id="st"></div>
</div>
<script>
var SUPA = 'https://jzkfembagpiuuoexmpoy.supabase.co/rest/v1';
var KEY = ['eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6a2ZlbWJhZ3BpdXVvZXhtcG95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NzYwNjEsImV4cCI6MjEwNjM1MjA2MX0','8euoI8CGkr3GBFiTrlaEmO8DtVyCF9jVaWPGORScg50'].join('.');

async function createTable() {
  document.getElementById('st').textContent = 'Creating table...';
  // Insert a test record — Supabase auto-creates the table structure if we use the right headers
  // First check if table exists
  try {
    var r = await fetch(SUPA + '/disputes?limit=1', {
      headers: {'apikey': KEY, 'Authorization': 'Bearer ' + KEY}
    });
    if (r.ok) {
      var data = await r.json();
      document.getElementById('st').innerHTML = '<span style="color:#166534;">&#10003; Disputes table already exists! Found ' + (Array.isArray(data) ? data.length : 0) + ' records. All good — Dispute Log will work.</span>';
      return;
    }
    // Table doesn't exist — show instructions
    document.getElementById('st').innerHTML = '<span style="color:#991B1B;">Table does not exist yet. Go to <a href=\"https://supabase.com/dashboard/project/jzkfembagpiuuoexmpoy/editor\" target=\"_blank\">Supabase SQL Editor</a> and run the SQL below.</span><br><br><textarea style=\"width:100%;height:180px;font-size:11px;font-family:monospace;\" readonly>CREATE TABLE IF NOT EXISTS disputes (\n  id text PRIMARY KEY,\n  client_id text,\n  client_name text,\n  client_email text,\n  client_phone text,\n  bureaus text,\n  items_count integer,\n  specialist text,\n  status text DEFAULT \'Filed\',\n  filed_at timestamptz DEFAULT now(),\n  next_action text,\n  notes text,\n  updated_at timestamptz DEFAULT now()\n);\nALTER TABLE disputes ENABLE ROW LEVEL SECURITY;\nCREATE POLICY \"Allow all\" ON disputes FOR ALL USING (true) WITH CHECK (true);</textarea>';
  } catch(e) {
    document.getElementById('st').innerHTML = '<span style="color:#991B1B;">Error: ' + e.message + '</span>';
  }
}
</script>
</body></html>
