<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment & Sales Dashboard — CP Restoration</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F8FAFC;color:#1E293B;font-size:14px;}
header{background:linear-gradient(135deg,#1B3A6B,#0A1628);padding:14px 20px;display:flex;align-items:center;gap:12px;}
header h1{color:white;font-size:15px;font-weight:800;flex:1;}
header a{color:rgba(255,255,255,.7);font-size:12px;text-decoration:none;}
.wrap{max-width:1300px;margin:0 auto;padding:20px;}

/* KPI Cards */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:20px;}
.kpi{background:white;border-radius:10px;padding:16px;border-left:4px solid #1B3A6B;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.kpi.gold{border-left-color:#C9A84C;}
.kpi.red{border-left-color:#8B1A1A;}
.kpi.green{border-left-color:#166534;}
.kpi.purple{border-left-color:#7C3AED;}
.kpi-val{font-size:22px;font-weight:800;color:#1B3A6B;}
.kpi.gold .kpi-val{color:#92400E;}
.kpi.red .kpi-val{color:#8B1A1A;}
.kpi.green .kpi-val{color:#166534;}
.kpi.purple .kpi-val{color:#7C3AED;}
.kpi-label{font-size:11px;color:#64748B;font-weight:700;text-transform:uppercase;margin-top:4px;}

/* Tabs */
.tabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap;}
.tab{padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;background:white;border:1.5px solid #E2E8F0;color:#64748B;}
.tab.active{background:#1B3A6B;color:white;border-color:#1B3A6B;}

/* Filters */
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.filters input,.filters select{padding:8px 12px;border:1.5px solid #E2E8F0;border-radius:8px;font-size:13px;font-family:inherit;}
.filters input{min-width:220px;}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;}
.b-active{background:#DCFCE7;color:#166534;}
.b-paused{background:#FEF9C3;color:#92400E;}
.b-paid{background:#DBEAFE;color:#1B3A6B;}
.b-refunded{background:#FEE2E2;color:#8B1A1A;}
.b-sold{background:#DCFCE7;color:#166534;}
.b-pending{background:#FEF9C3;color:#92400E;}
.b-other{background:#F1F5F9;color:#475569;}

/* Table */
.tbl-wrap{background:white;border-radius:12px;border:1.5px solid #E2E8F0;overflow:auto;margin-bottom:20px;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{background:#F8FAFC;padding:10px 12px;text-align:left;font-size:11px;font-weight:700;color:#64748B;text-transform:uppercase;border-bottom:2px solid #E2E8F0;white-space:nowrap;}
td{padding:10px 12px;border-bottom:1px solid #F1F5F9;vertical-align:top;}
tr:hover td{background:#F8FAFC;}
.name-cell{font-weight:700;color:#1B3A6B;}
.amt{font-weight:700;}
.amt.owed{color:#8B1A1A;}
.amt.paid{color:#166534;}
.progress{background:#F1F5F9;border-radius:4px;height:6px;min-width:80px;overflow:hidden;margin-top:4px;}
.progress-fill{height:100%;border-radius:4px;background:#166534;}
.progress-fill.behind{background:#F59E0B;}
.progress-fill.low{background:#8B1A1A;}
.empty{text-align:center;padding:40px;color:#94A3B8;}
.count-badge{background:#EFF6FF;color:#1B3A6B;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;margin-left:8px;}
</style>
</head>
<body>
<header>
  <h1>&#128200; Payment &amp; Sales Dashboard</h1>
  <a href="/dashboard.html">&larr; Back to Dashboard</a>
</header>

<div class="wrap">
  <!-- KPI Cards -->
  <div class="kpi-grid" id="kpi-grid"></div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" onclick="switchTab('payments',this)">&#128178; Payment Plans <span class="count-badge" id="pp-count">153</span></div>
    <div class="tab" onclick="switchTab('sales',this)">&#127881; Sales Records <span class="count-badge" id="sales-count">437</span></div>
    <div class="tab" onclick="switchTab('overdue',this)">&#9888; Overdue / Paused <span class="count-badge" id="overdue-count"></span></div>
    <div class="tab" onclick="switchTab('reps',this)">&#128101; By Sales Rep</div>
  </div>

  <!-- Filters -->
  <div class="filters" id="filter-bar">
    <input type="text" id="srch" placeholder="&#128269; Search name, email, phone..." oninput="render()">
    <select id="status-filter" onchange="render()">
      <option value="">All Statuses</option>

    </select>
    <select id="rep-filter" onchange="render()">
      <option value="">All Reps</option>
    </select>
  </div>

  <!-- Tables -->
  <div class="tbl-wrap" id="table-wrap">
    <table><tbody id="tbl-body"><tr><td class="empty">Loading...</td></tr></tbody></table>
  </div>
</div>

var currentTab = 'payments';

function fmt(n){ return n==null?'$0':'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function statusBadge(s) {
  s = (s||'').toUpperCase();
  var cls = s==='ACTIVE'?'b-active':s==='PAUSED'?'b-paused':s==='PAID'||s==='APPROVED'?'b-paid':s==='REFUNDED'?'b-refunded':s==='SOLD'?'b-sold':s==='PENDING'?'b-pending':'b-other';
  return '<span class="badge '+cls+'">'+esc(s||'—')+'</span>';
}

function renderKPIs() {
  var totalOwed = PAYMENT_PLANS.reduce(function(a,p){return a+(p.balance>0?p.balance:0);},0);
  var totalCollected = PAYMENT_PLANS.reduce(function(a,p){return a+p.paid;},0);
  var active = PAYMENT_PLANS.filter(function(p){return p.status.toUpperCase()==='ACTIVE';}).length;
  var paused = PAYMENT_PLANS.filter(function(p){return p.status.toUpperCase()==='PAUSED';}).length;
  var paidOff = PAYMENT_PLANS.filter(function(p){return p.balance<=0;}).length;
  var totalSales = ALL_SALES.reduce(function(a,s){return a+(s.total||0);},0);
  var soldCount = ALL_SALES.filter(function(s){return (s.status||'').toLowerCase().includes('sold');}).length;
  document.getElementById('kpi-grid').innerHTML =
    kpi('$'+Number(totalCollected).toLocaleString('en-US',{maximumFractionDigits:0}),'Total Collected','green') +
    kpi('$'+Number(totalOwed).toLocaleString('en-US',{maximumFractionDigits:0}),'Outstanding Balance','red') +
    kpi(active,'Active Plans','') +
    kpi(paused,'Paused Plans','gold') +
    kpi(paidOff,'Paid Off','green') +
    kpi('$'+Number(totalSales).toLocaleString('en-US',{maximumFractionDigits:0}),'Total Sales Value','purple') +
    kpi(soldCount,'Total Clients Sold','purple');
  document.getElementById('overdue-count').textContent = paused;
}

function kpi(val, label, cls) {
  return '<div class="kpi '+cls+'"><div class="kpi-val">'+val+'</div><div class="kpi-label">'+label+'</div></div>';
}

function populateRepFilter() {
  var reps = [...new Set(PAYMENT_PLANS.map(function(p){return p.rep;}).filter(Boolean))].sort();
  var sel = document.getElementById('rep-filter');
  reps.forEach(function(r){ var o=document.createElement('option'); o.value=r; o.textContent=r; sel.appendChild(o); });
}

function switchTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  el.classList.add('active');
  render();
}

function render() {
  var srch = document.getElementById('srch').value.toLowerCase();
  var statusF = document.getElementById('status-filter').value.toUpperCase();
  var repF = document.getElementById('rep-filter').value;
  var tbody = document.getElementById('tbl-body');

  if (currentTab === 'payments' || currentTab === 'overdue') {
    var data = PAYMENT_PLANS.filter(function(p) {
      if (currentTab === 'overdue' && p.status.toUpperCase() !== 'PAUSED' && p.balance <= 0) return false;
      if (currentTab === 'overdue' && p.status.toUpperCase() === 'ACTIVE' && p.balance <= 0) return false;
      if (statusF && p.status.toUpperCase() !== statusF) return false;
      if (repF && p.rep !== repF) return false;
      if (srch && !p.name.toLowerCase().includes(srch) && !p.email.toLowerCase().includes(srch) && !p.phone.toLowerCase().includes(srch)) return false;
      return true;
    });
    document.getElementById('pp-count').textContent = currentTab==='payments'?data.length:PAYMENT_PLANS.length;
    if (!data.length) { tbody.innerHTML='<tr><td colspan="8" class="empty">No records found.</td></tr>'; return; }
    tbody.innerHTML = data.map(function(p) {
      var pct = p.pct||0;
      var fillCls = pct>=100?'':pct>=50?'behind':'low';
      return '<tr>' +
        '<td><div class="name-cell">'+esc(p.name)+'</div><div style="font-size:11px;color:#64748B;">'+esc(p.phone)+'</div></td>' +
        '<td>'+statusBadge(p.status)+'</td>' +
        '<td><span style="font-size:11px;color:#64748B;">Rep: </span>'+esc(p.rep)+'</td>' +
        '<td class="amt">'+fmt(p.total)+'</td>' +
        '<td class="amt paid">'+fmt(p.paid)+'<div class="progress"><div class="progress-fill '+fillCls+'" style="width:'+Math.min(100,pct)+'%;"></div></div><div style="font-size:10px;color:#94A3B8;">'+pct+'% paid</div></td>' +
        '<td class="amt owed">'+(p.balance>0?fmt(p.balance):'<span class="badge b-paid">PAID OFF</span>')+'</td>' +
        '<td style="font-size:11px;color:#64748B;">'+esc(p.date)+'</td>' +
        '<td style="font-size:11px;color:#64748B;">'+esc(p.email)+'</td>' +
      '</tr>';
    }).join('');
  } else if (currentTab === 'sales') {
    var data = ALL_SALES.filter(function(s) {
      if (repF && s.rep !== repF) return false;
      if (srch && !s.name.toLowerCase().includes(srch) && !s.email.toLowerCase().includes(srch) && !s.phone.toLowerCase().includes(srch) && !s.app_id.toLowerCase().includes(srch)) return false;
      return true;
    });
    document.getElementById('sales-count').textContent = data.length;
    if (!data.length) { tbody.innerHTML='<tr><td colspan="8" class="empty">No records found.</td></tr>'; return; }
    tbody.innerHTML = data.map(function(s) {
      return '<tr>' +
        '<td><div class="name-cell">'+esc(s.name)+'</div><div style="font-size:11px;color:#64748B;">'+esc(s.app_id)+'</div></td>' +
        '<td>'+statusBadge(s.status)+'<br>'+statusBadge(s.app_status)+'</td>' +
        '<td>'+esc(s.rep)+'</td>' +
        '<td class="amt">'+fmt(s.total)+'</td>' +
        '<td class="amt paid">'+fmt(s.deposit)+'</td>' +
        '<td style="font-size:11px;color:#64748B;max-width:150px;">'+esc(s.package)+'</td>' +
        '<td style="font-size:11px;color:#64748B;">'+esc(s.date)+'</td>' +
        '<td style="font-size:11px;color:#64748B;">'+esc(s.phone)+'<br>'+esc(s.email)+'</td>' +
      '</tr>';
    }).join('');
  } else if (currentTab === 'reps') {
    // Rep summary
    var reps = [...new Set(ALL_SALES.map(function(s){return s.rep;}))].filter(Boolean).sort();
    var html = '<tr><th>Sales Rep</th><th>Total Clients</th><th>Sold</th><th>Total Sales Value</th><th>Total Collected</th><th>Avg Sale</th></tr>';
    reps.forEach(function(rep) {
      var repSales = ALL_SALES.filter(function(s){return s.rep===rep;});
      var sold = repSales.filter(function(s){return (s.status||'').toLowerCase().includes('sold');});
      var totalVal = sold.reduce(function(a,s){return a+(s.total||0);},0);
      var totalDep = sold.reduce(function(a,s){return a+(s.deposit||0);},0);
      var avg = sold.length ? totalVal/sold.length : 0;
      html += '<tr><td class="name-cell">'+esc(rep)+'</td><td>'+repSales.length+'</td><td>'+sold.length+'</td><td class="amt">'+fmt(totalVal)+'</td><td class="amt paid">'+fmt(totalDep)+'</td><td class="amt">'+fmt(avg)+'</td></tr>';
    });
    tbody.innerHTML = html;
  }
}

// Table headers by tab
var HEADERS = {
  payments: ['Client Name / Phone','Status','Rep','Total','Paid','Balance','Start Date','Email'],
  sales: ['Client / App ID','Status','Rep','Sale Amount','Deposit','Package','Date','Contact'],
  overdue: ['Client Name / Phone','Status','Rep','Total','Paid','Balance','Start Date','Email'],
  reps: ['Sales Rep','Total Clients','Sold','Total Value','Collected','Avg Sale']
};

var origRender = render;
render = function() {
  var hdrs = HEADERS[currentTab]||HEADERS.payments;
  document.querySelector('table').querySelector('tr') && null;
  var table = document.querySelector('table');
  var thead = table.querySelector('thead');
  if (!thead) { thead = document.createElement('thead'); table.insertBefore(thead, table.firstChild); }
  thead.innerHTML = '<tr>'+hdrs.map(function(h){return '<th>'+h+'</th>';}).join('')+'</tr>';
  origRender();
};

document.addEventListener('DOMContentLoaded', function() {
  renderKPIs();
  populateRepFilter();
  render();
});
</script>
