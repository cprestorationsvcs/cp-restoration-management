<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',system-ui,sans-serif;}
body{background:#F8FAFC;min-height:100vh;}
.hdr{background:#1B3A6B;color:white;padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;}
.hdr h1{font-size:15px;font-weight:800;flex:1;}
.hdr-btns{display:flex;gap:8px;}
.btn{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:none;font-family:inherit;}
.btn-gold{background:#C9A84C;color:white;}
.btn-ghost{background:rgba(255,255,255,0.15);color:white;border:1px solid rgba(255,255,255,0.3);}
.tabs{background:white;border-bottom:2px solid #E2E8F0;padding:0 20px;display:flex;gap:4px;}
.tab{padding:12px 16px;font-size:13px;font-weight:700;color:#64748B;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;}
.tab.active{color:#1B3A6B;border-bottom-color:#1B3A6B;}

.filters{padding:12px 20px;background:white;border-bottom:1px solid #E2E8F0;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}

.wrap{padding:20px;max-width:1100px;margin:0 auto;}
.appt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;}
.appt-card{background:white;border:1.5px solid #E2E8F0;border-radius:14px;padding:18px;position:relative;}
.appt-card.overdue{border-color:#EF4444;background:#FFF5F5;}
.appt-card.completed{border-color:#22C55E;background:#F0FDF4;opacity:0.85;}
.appt-card.cancelled{opacity:0.6;}
.appt-status-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}

.s-booked{background:#DBEAFE;color:#1D4ED8;}
.s-overdue{background:#FEE2E2;color:#991B1B;}
.s-called-reached{background:#DCFCE7;color:#166534;}
.s-called-no-answer{background:#FEF3C7;color:#92400E;}
.s-completed{background:#DCFCE7;color:#166534;}
.s-no-show{background:#FEE2E2;color:#991B1B;}
.s-cancelled{background:#F1F5F9;color:#64748B;}
.s-rescheduled{background:#EDE9FE;color:#5B21B6;}
.appt-time{font-size:15px;font-weight:900;color:#1B3A6B;margin-bottom:4px;}
.appt-title{font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;}
.appt-client{font-size:13px;color:#1E293B;font-weight:600;}
.appt-phone{font-size:12px;color:#64748B;margin-top:2px;}
.appt-rep{font-size:11px;color:#94A3B8;margin-top:6px;}
.appt-team{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;margin-top:4px;}
.team-sales{background:#FEF3C7;color:#92400E;}
.team-cs{background:#EDE9FE;color:#5B21B6;}
.appt-notes{font-size:12px;color:#64748B;margin-top:8px;padding:8px;background:#F8FAFC;border-radius:6px;display:none;}
.appt-actions{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;}
.action-btn{padding:5px 10px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid #E2E8F0;background:white;font-family:inherit;}
.action-btn:hover{background:#F8FAFC;}
.action-btn.green{border-color:#22C55E;color:#166534;}
.action-btn.red{border-color:#EF4444;color:#991B1B;}
.action-btn.gold{border-color:#C9A84C;color:#92400E;}
.attempt-count{font-size:10px;color:#94A3B8;margin-top:4px;}
.overdue-banner{background:#EF4444;color:white;padding:10px 20px;font-size:13px;font-weight:700;display:none;}
.empty{text-align:center;padding:60px 20px;color:#94A3B8;}
.empty-ico{font-size:48px;margin-bottom:12px;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;display:none;align-items:center;justify-content:center;}
.modal{background:white;border-radius:16px;padding:28px;width:90%;max-width:480px;}
.modal h3{font-size:18px;font-weight:800;color:#1B3A6B;margin-bottom:16px;}
.field-group{margin-bottom:14px;}
.field-group label{display:block;font-size:12px;font-weight:700;color:#1B3A6B;text-transform:uppercase;margin-bottom:5px;}
.field-group input,.field-group select,.field-group textarea{width:100%;padding:10px;border:1.5px solid #E2E8F0;border-radius:8px;font-size:13px;font-family:inherit;}
.modal-btns{display:flex;gap:10px;margin-top:16px;}
.btn-navy{background:#1B3A6B;color:white;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:inherit;}
.btn-cancel{background:#F1F5F9;color:#475569;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:inherit;}
</style>

<div class="hdr">
  <h1>📅 Appointments Calendar</h1>
  <div class="hdr-btns">
    <button class="btn btn-ghost" onclick="loadAppts()">⟳ Refresh</button>
    <button class="btn btn-gold" onclick="openBlockModal()">+ Block Time Off</button>
  </div>
</div>

<div id="overdue-banner" class="overdue-banner">🔴 <span id="overdue-count">0</span> overdue appointments need attention!</div>

<div class="wrap">
  <div class="appt-grid" id="appt-grid">
    <div class="empty"><div class="empty-ico">⏳</div><div>Loading appointments...</div></div>

<!-- Block time modal -->
<div class="modal-overlay" id="block-modal">
  <div class="modal">
    <h3>🚫 Block Time Off</h3>
    <div class="field-group"><label>Rep Name</label>
      <select id="bk-rep">
        <option value="rosemarie@mycprteam.com">Rose Marie (Sales)</option>
        <option value="raymon.guevarra@mycprteam.com">Raymon Guevarra (Sales)</option>

<!-- Status update modal -->
<div class="modal-overlay" id="status-modal">

    <input type="hidden" id="sm-appt-id">
    <div class="field-group"><label>New Status</label>
      <select id="sm-status">
        <option value="Booked">Booked</option>
        <option value="Called (reached)">Called (reached)</option>
        <option value="Called (no answer)">Called (no answer)</option>

        <option value="Cancelled">Cancelled</option>

<script>
var SUPA = 'https://jzkfembagpiuuoexmpoy.supabase.co/rest/v1';
var KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6a2ZlbWJhZ3BpdXVvZXhtcG95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NzYwNjEsImV4cCI6MjEwNjM1MjA2MX0.8euoI8CGkr3GBFiTrlaEmO8DtVyCF9jVaWPGORScg50';
var HDR  = {'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'};
var allAppts = [];
var currentTab = 'today';
var currentUser = localStorage.getItem('currentUser') || '';
var currentName = localStorage.getItem('currentName') || '';

// Rep email → name map (portal only, item 10)
var REP_NAMES = {
  'rosemarie@mycprteam.com': 'Rose Marie',
  'raymon.guevarra@mycprteam.com': 'Raymon Guevarra',
  'alec@mycprteam.com': 'Alec Sarrosa',
  'elna@mycprteam.com': 'Elna Palabrica',
  'raven@mycprteam.com': 'Raven'
};

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function setTab(t, el) {
  currentTab = t;
  document.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('active'); });
  if(el) el.classList.add('active');
  render();
}

async function loadAppts() {
  try {
  var r = await safeFetch(SUPA_BASE + (SUPA.replace ? SUPA.replace(SUPA_BASE,'') : '') + '/appointments?order=appointment_date.asc&limit=200&select=*', { headers: HDR });
  var data = await r.json();
  if (Array.isArray(data)) allAppts = data;
  checkOverdue();
  render();

  } catch(e){ console.error("[Appts] loadAppts error:",e.message); document.getElementById("appt-grid").innerHTML="<div class='empty'><div>⚠️ Error loading appointments. Please refresh.</div></div>"; }}

function checkOverdue() {
  var now = new Date();
  var overdue = allAppts.filter(function(a) {
    if (a.appointment_status !== 'Booked') return false;
    var d = new Date(a.appointment_date);
    return (now - d) > 15 * 60 * 1000;
  });
  var cnt = overdue.length;
  document.getElementById('badge-overdue').textContent = cnt;
  document.getElementById('badge-overdue').style.display = cnt ? 'inline' : 'none';
  document.getElementById('overdue-count').textContent = cnt;
  document.getElementById('overdue-banner').style.display = cnt ? 'block' : 'none';

  // Mark overdue in DB and alert if needed
  overdue.forEach(async function(a) {
    if (!a.overdue_alerted) {
      await fetch(SUPA + '/appointments?id=eq.' + a.id, {
        method: 'PATCH', headers: HDR, body: JSON.stringify({ overdue_alerted: true })
      });
      // Notify team chat
      var repName = REP_NAMES[a.assigned_rep] || a.assigned_rep;
      await fetch(SUPA + '/team_chat', {
        method: 'POST', headers: HDR,
        body: JSON.stringify({
          channel: 'general', sender: 'Calendar', sender_role: 'system',
          message: '⚠️ OVERDUE APPOINTMENT — ' + (a.title||'Appointment') + ' was scheduled for ' + new Date(a.appointment_date).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}) + ' — ' + repName + ' please follow up immediately!',
          created_at: new Date().toISOString()
        })
      });
    }
    // Manager alert after 1 hour
    var d = new Date(a.appointment_date);
    if ((new Date() - d) > 60 * 60 * 1000 && !a.manager_alerted) {
      await fetch(SUPA + '/appointments?id=eq.' + a.id, {
        method: 'PATCH', headers: HDR, body: JSON.stringify({ manager_alerted: true })
      });
      await fetch(SUPA + '/team_chat', {
        method: 'POST', headers: HDR,
        body: JSON.stringify({
          channel: 'general', sender: 'Calendar', sender_role: 'system',
          message: '🚨 MANAGER ALERT — Appointment still unhandled after 1 hour: ' + (a.title||'') + ' | Client: ' + (a.client_name||'Unknown') + ' | Phone: ' + (a.client_phone||'—') + ' | @Jason please review',
          created_at: new Date().toISOString()
        })
      });
    }
  });
}

function render() {
  var now = new Date();
  var todayStr = now.toISOString().split('T')[0];
  var filterStatus = document.getElementById('filter-status').value;
  var filterTeam   = document.getElementById('filter-team').value;
  var filterDate   = document.getElementById('filter-date').value;

  var items = allAppts.filter(function(a) {
    var aDate = new Date(a.appointment_date);
    var aStr  = aDate.toISOString().split('T')[0];
    if (currentTab === 'today' && aStr !== todayStr) return false;
    if (currentTab === 'overdue') {
      if (a.appointment_status !== 'Booked') return false;
      if ((now - aDate) < 15 * 60 * 1000) return false;
    }
    if (currentTab === 'mine' && a.assigned_rep !== currentUser) return false;
    if (filterStatus && a.appointment_status !== filterStatus) return false;
    if (filterTeam && a.team !== filterTeam) return false;
    if (filterDate && aStr !== filterDate) return false;
    return true;
  });

  // Sort by time
  items.sort(function(a,b){ return new Date(a.appointment_date) - new Date(b.appointment_date); });

  // Today badge
  var todayCount = allAppts.filter(function(a){ return new Date(a.appointment_date).toISOString().split('T')[0]===todayStr; }).length;
  document.getElementById('badge-today').textContent = todayCount;
  document.getElementById('badge-today').style.display = todayCount ? 'inline' : 'none';

  var grid = document.getElementById('appt-grid');
  if (!items.length) {
    grid.innerHTML = '<div class="empty"><div class="empty-ico">📅</div><div>No appointments found</div></div>';
    return;
  }

  grid.innerHTML = items.map(function(a) {
    var aDate = new Date(a.appointment_date);
    var isOverdue = a.appointment_status === 'Booked' && (now - aDate) > 15 * 60 * 1000;
    var statusChip = 'booked';
    var chipClass = 's-booked';
    if (isOverdue) { chipClass = 's-overdue'; statusChip = '⚠️ OVERDUE'; }
    else if (a.appointment_status === 'Called (reached)') { chipClass = 's-called-reached'; statusChip = a.appointment_status; }
    else if (a.appointment_status === 'Called (no answer)') { chipClass = 's-called-no-answer'; statusChip = a.appointment_status; }
    else if (a.appointment_status === 'Completed') { chipClass = 's-completed'; statusChip = a.appointment_status; }
    else if (a.appointment_status === 'No-show') { chipClass = 's-no-show'; statusChip = a.appointment_status; }
    else if (a.appointment_status === 'Cancelled') { chipClass = 's-cancelled'; statusChip = a.appointment_status; }
    else if (a.appointment_status === 'Rescheduled') { chipClass = 's-rescheduled'; statusChip = a.appointment_status; }
    else statusChip = a.appointment_status || 'Booked';

    var timeStr = aDate.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:'America/New_York'}) + ' ET';
    var repName = REP_NAMES[a.assigned_rep] || a.assigned_rep || '—';
    var teamLabel = a.team === 'customer_service' ? 'Customer Service' : 'Sales';
    var teamClass = a.team === 'customer_service' ? 'team-cs' : 'team-sales';

    return '<div class="appt-card' + (isOverdue?' overdue':'') + (a.appointment_status==='Completed'?' completed':'') + (a.appointment_status==='Cancelled'?' cancelled':'') + '" id="card-'+a.id+'">' +
      '<div class="appt-status-bar">' +
        '<span class="status-chip ' + chipClass + '">' + esc(statusChip) + '</span>' +
        '<span class="appt-team ' + teamClass + '">' + teamLabel + '</span>' +
      '</div>' +
      '<div class="appt-time">' + timeStr + '</div>' +
      '<div class="appt-title">' + esc(a.title || a.service_type || 'Appointment') + '</div>' +
      '<div class="appt-client">👤 ' + esc(a.client_name || 'Unknown') + '</div>' +
      '<div class="appt-phone">📞 ' + esc(a.client_phone || '—') + (a.client_email ? ' · ' + esc(a.client_email) : '') + '</div>' +
      '<div class="appt-rep">Assigned: ' + esc(repName) + '</div>' +
      (a.notes ? '<div class="appt-notes" style="display:block">' + esc(a.notes) + '</div>' : '') +
      (a.attempt_count > 0 ? '<div class="attempt-count">Call attempts: ' + a.attempt_count + '</div>' : '') +
      '<div class="appt-actions">' +
        (a.appointment_status !== 'Completed' && a.appointment_status !== 'Cancelled' ? 
          '<button class="action-btn green" onclick="openStatusModal(\''+a.id+'\',\'Called (reached)\')">✅ Reached</button>' +
          '<button class="action-btn gold" onclick="openStatusModal(\''+a.id+'\',\'Called (no answer)\')">📞 No Answer</button>' +
          '<button class="action-btn" onclick="openStatusModal(\''+a.id+'\',\'\')">✏️ Update</button>' +
          '<button class="action-btn red" onclick="openStatusModal(\''+a.id+'\',\'Cancelled\')">❌ Cancel</button>'
        : '') +
      '</div>' +
    '</div>';
  }).join('');
}

function openStatusModal(apptId, presetStatus) {
  document.getElementById('sm-appt-id').value = apptId;
  document.getElementById('sm-status').value = presetStatus || 'Booked';
  document.getElementById('sm-notes').value = '';
  document.getElementById('status-modal').style.display = 'flex';
}

async function saveStatus() {
  var apptId = document.getElementById('sm-appt-id').value;
  var status  = document.getElementById('sm-status').value;
  var notes   = document.getElementById('sm-notes').value.trim();
  
  var appt = allAppts.find(function(a){ return String(a.id) === String(apptId); });
  var attempts = (appt ? appt.attempt_count || 0 : 0);
  if (status === 'Called (no answer)') attempts++;

  await fetch(SUPA + '/appointments?id=eq.' + apptId, {
    method: 'PATCH', headers: HDR,
    body: JSON.stringify({
      appointment_status: status,
      notes: notes || null,
      attempt_count: attempts,
      status_set_by: currentUser || currentName,
      status_set_at: new Date().toISOString()
    })
  });

  // If completed, update lead status too (item 12)
  if (status === 'Completed' && appt && appt.lead_id) {
    await fetch(SUPA + '/leads?id=eq.' + appt.lead_id, {
      method: 'PATCH', headers: HDR,
      body: JSON.stringify({ status: 'contacted', pipeline_stage: 'qualified', updated_at: new Date().toISOString() })
    });
  }

  closeModal('status-modal');
  loadAppts();
}

function openBlockModal() {
  document.getElementById('block-modal').style.display = 'flex';
  document.getElementById('bk-date').value = new Date().toISOString().split('T')[0];
}

async function saveBlock() {
  var rep   = document.getElementById('bk-rep').value;
  var date  = document.getElementById('bk-date').value;
  var start = document.getElementById('bk-start').value;
  var end   = document.getElementById('bk-end').value;
  var reason= document.getElementById('bk-reason').value;
  if (!date || !start || !end) { alert('Please fill date, start and end time.'); return; }
  await fetch(SUPA + '/time_off_blocks', {
    method: 'POST', headers: HDR,
    body: JSON.stringify({ rep_email: rep, date, start_time: start, end_time: end, reason, created_at: new Date().toISOString() })
  });
  closeModal('block-modal');
  alert('Time block saved.');
}

function closeModal(id) { document.getElementById(id).style.display = 'none'; }
function clearFilters() {
  document.getElementById('filter-status').value = '';
  document.getElementById('filter-team').value = '';
  document.getElementById('filter-date').value = '';
  render();
}
