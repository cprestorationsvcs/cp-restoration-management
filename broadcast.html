  if(ok) log('✅ Test sent! Check jason@mycprteam.com — if received, click Send to All.','#4ADE80');
}

async function startSend(){
  if(running)return;
  if(!confirm('Send to ALL '+EMAILS.length+' clients? Make sure you received the test first.'))return;
  running=true; sent=0; failed=0; batches=0;
  document.getElementById('send-btn').disabled=true;
  log('Starting blast to '+EMAILS.length+' clients...','#60A5FA');
  var BATCH=1000;
  for(var i=0;i<EMAILS.length;i+=BATCH){
    var b=EMAILS.slice(i,i+BATCH);
    log('Batch '+(batches+1)+': sending '+(i+1)+'-'+Math.min(i+BATCH,EMAILS.length)+'...','#FCD34D');
    await sendBatch(b); upd();
    if(i+BATCH<EMAILS.length) await new Promise(function(r){setTimeout(r,1500);});
  }
  running=false;
  document.getElementById('send-btn').disabled=false;
  log('=== DONE === Sent: '+sent+' | Failed: '+failed,'#4ADE80');
}
</script>
