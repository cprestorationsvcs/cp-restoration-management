<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Tracker | CP Restoration</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
body { background: #1B3A6B; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.card { background: white; border-radius: 20px; padding: 36px 32px; width: 100%; max-width: 440px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.logo { text-align: center; margin-bottom: 28px; }
.logo-badge { width: 60px; height: 60px; background: #1B3A6B; border-radius: 14px; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; }
.logo-badge span { color: #C9A84C; font-size: 18px; font-weight: 900; }
.logo h1 { color: #1B3A6B; font-size: 20px; font-weight: 800; }
.logo p { color: #C9A84C; font-size: 12px; font-weight: 600; margin-top: 2px; }
label { display: block; font-size: 11px; font-weight: 700; color: #1B3A6B; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; margin-top: 16px; }
select, input { width: 100%; padding: 12px 14px; border: 2px solid #E2E8F0; border-radius: 10px; font-size: 14px; font-family: 'Inter', sans-serif; outline: none; color: #1E293B; }
select:focus, input:focus { border-color: #1B3A6B; }
.btn { width: 100%; padding: 14px; background: #1B3A6B; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 20px; font-family: 'Inter', sans-serif; }
.btn:hover { background: #142d55; }
.btn:disabled { background: #94A3B8; cursor: not-allowed; }
.btn-out { background: #8B1A1A; }
.btn-out:hover { background: #6b1414; }
.timer { text-align: center; font-size: 48px; font-weight: 900; color: #1B3A6B; margin: 20px 0 8px; letter-spacing: -2px; }
.timer-label { text-align: center; font-size: 12px; color: #94A3B8; font-weight: 600; margin-bottom: 20px; }
.status { text-align: center; padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 700; margin-top: 16px; display: none; }
.status.success { background: #DCFCE7; color: #166534; display: block; }
.status.error { background: #FEE2E2; color: #991B1B; display: block; }
.clocked-in-badge { display: none; text-align: center; background: #DCFCE7; border-radius: 10px; padding: 12px; margin-top: 16px; font-size: 13px; font-weight: 700; color: #166534; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-badge"><span>CPR</span></div>
    <h1>CP Restoration Services</h1>
    <p>Time Tracker</p>
  </div>

  <div id="select-screen">
    <label>Select Your Name</label>
    <select id="name-select">
      <option value="">-- Select your name --</option>
      <option value="jason@mycprteam.com|Jason Crown|admin">Jason Crown</option>
      <option value="queen@mycprteam.com|Queen Jearel Cruz|compliance">Queen Jearel Cruz</option>
      <option value="elna@mycprteam.com|Elna Palabrica|cs">Elna Palabrica</option>
      <option value="alec@mycprteam.com|Alec Sarrosa|cs">Alec Sarrosa</option>
      <option value="marcelo@mycprteam.com|Marcelo Torres|dispute">Marcelo Torres</option>
      <option value="annabel@mycprteam.com|Annabel Curada|dispute">Annabel Curada</option>
      <option value="bukunmi@mycprteam.com|Bukunmi Aina|leadgen">Bukunmi Aina</option>
      <option value="fcacaasi@gmail.com|Fatima Charfina Caasi|bureau">Fatima Charfina Caasi</option>
      <option value="raymon.guevarra@mycprteam.com|Raymon Guevarra|sales">Raymon Guevarra</option>
      <option value="jose.perez@mycprteam.com|Jose Perez (Sid)|sales">Jose Perez (Sid)</option>
      <option value="elmer.jungco@mycprteam.com|Elmer Jungco|sales">Elmer Jungco</option>
      <option value="cherry.manlapaz@mycprteam.com|Cherry Manlapaz|sales">Cherry Manlapaz</option>
      <option value="raven.pasco@mycprteam.com|Raven Pasco|sales">Raven Pasco</option>
      <option value="rosemarie.deguzman@mycprteam.com|Rosemarie De Guzman|bureau">Rosemarie De Guzman</option>
      <option value="redan.abella@mycprteam.com|Redan Abella|bureau">Redan Abella</option>
    </select>
    <button class="btn" onclick="confirmName()">Continue →</button>
  </div>

  <div id="clock-screen" style="display:none;">
    <div style="text-align:center;margin-bottom:8px;font-size:13px;color:#64748B;" id="greeting">Good morning</div>
    <div style="text-align:center;font-size:22px;font-weight:800;color:#1B3A6B;" id="display-name"></div>
    <div style="text-align:center;font-size:11px;color:#94A3B8;margin-bottom:16px;" id="display-date"></div>
    <div class="timer" id="timer-display">00:00:00</div>
    <div class="timer-label" id="timer-label">Not clocked in</div>
    <button class="btn" id="btn-in" onclick="clockIn()">⏺ Clock In</button>
    <button class="btn btn-out" id="btn-out" onclick="clockOut()" style="display:none;">⏹ Clock Out</button>
    <div class="clocked-in-badge" id="clocked-badge">✅ You are clocked in</div>
    <div style="text-align:center;margin-top:16px;"><a href="#" onclick="changeName()" style="font-size:12px;color:#94A3B8;">Not you? Switch name</a></div>
    <div id="status-msg" class="status"></div>
  </div>
</div>

<script>
var SUPA = "https://jzkfembagpiuuoexmpoy.supabase.co";
var KEY  = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6a2ZlbWJhZ3BpdXVvZXhtcG95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NzYwNjEsImV4cCI6MjEwNjM1MjA2MX0.8euoI8CGkr3GBFiTrlaEmO8DtVyCF9jVaWPGORScg50";
var HDR  = {"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json","Prefer":"return=minimal"};

var _email = '', _name = '', _role = '';
var _sessionId = null, _clockedIn = false, _clockInTime = null;
var _timer = null;

function confirmName() {
  var sel = document.getElementById('name-select');
  if(!sel.value) { alert('Please select your name.'); return; }
  var parts = sel.value.split('|');
  _email = parts[0]; _name = parts[1]; _role = parts[2]||'staff';
  localStorage.setItem('cp_logged_in_user', _email);
  localStorage.setItem('cp_logged_in_name', _name);
  localStorage.setItem('cp_logged_in_role', _role);
  showClock();
}

function changeName() {
  _email=''; _name=''; _role='';
  if(_timer) clearInterval(_timer);
  document.getElementById('select-screen').style.display='block';
  document.getElementById('clock-screen').style.display='none';
}

function showClock() {
  document.getElementById('select-screen').style.display='none';
  document.getElementById('clock-screen').style.display='block';
  document.getElementById('display-name').textContent = _name;
  var now = new Date();
  var hr = now.getHours();
  var greeting = hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening';
  document.getElementById('greeting').textContent = greeting + ',';
  document.getElementById('display-date').textContent = now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
}

async function clockIn() {
  if(_clockedIn) return;
  var btn = document.getElementById('btn-in');
  btn.disabled = true; btn.textContent = 'Clocking in...';
  try {
    // Close any existing active sessions
    await fetch(SUPA+'/rest/v1/time_sessions?employee_email=eq.'+encodeURIComponent(_email)+'&status=eq.active', {
      method:'PATCH', headers:HDR, body:JSON.stringify({status:'completed',clock_out:new Date().toISOString()})
    }).catch(function(){});
    // Create new session
    var r = await fetch(SUPA+'/rest/v1/time_sessions', {
      method:'POST',
      headers:Object.assign({},HDR,{'Prefer':'return=representation'}),
      body:JSON.stringify({
        employee_email:_email, employee_name:_name, role:_role,
        clock_in:new Date().toISOString(),
        date:new Date().toISOString().split('T')[0],
        status:'active'
      })
    });
    var data = await r.json();
    _sessionId = Array.isArray(data) ? data[0].id : data.id;
    _clockedIn = true;
    _clockInTime = new Date();
    document.getElementById('btn-in').style.display='none';
    document.getElementById('btn-out').style.display='block';
    document.getElementById('clocked-badge').style.display='block';
    document.getElementById('timer-label').textContent = 'Session started at '+_clockInTime.toLocaleTimeString();
    showStatus('Clocked in successfully!','success');
    _timer = setInterval(updateTimer, 1000);
  } catch(e) {
    btn.disabled=false; btn.textContent='⏺ Clock In';
    showStatus('Error clocking in. Please try again.','error');
  }
}

async function clockOut() {
  if(!_clockedIn) return;
  var btn = document.getElementById('btn-out');
  btn.disabled=true; btn.textContent='Clocking out...';
  try {
    var now = new Date();
    var hrs = (now - _clockInTime) / 3600000;
    await fetch(SUPA+'/rest/v1/time_sessions?id=eq.'+_sessionId, {
      method:'PATCH', headers:HDR,
      body:JSON.stringify({status:'completed',clock_out:now.toISOString(),active_hours:Math.round(hrs*100)/100})
    });
    clearInterval(_timer);
    _clockedIn=false; _sessionId=null;
    document.getElementById('btn-out').style.display='none';
    document.getElementById('btn-in').style.display='block';
    document.getElementById('btn-in').disabled=false;
    document.getElementById('clocked-badge').style.display='none';
    document.getElementById('timer-label').textContent='Not clocked in';
    document.getElementById('timer-display').textContent='00:00:00';
    showStatus('Clocked out. Total: '+document.getElementById('timer-display').textContent,'success');
  } catch(e) {
    btn.disabled=false; btn.textContent='⏹ Clock Out';
    showStatus('Error clocking out. Please try again.','error');
  }
}

function updateTimer() {
  if(!_clockInTime) return;
  var diff = Math.floor((new Date()-_clockInTime)/1000);
  var h=Math.floor(diff/3600), m=Math.floor((diff%3600)/60), s=diff%60;
  document.getElementById('timer-display').textContent =
    String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

function showStatus(msg, type) {
  var el = document.getElementById('status-msg');
  el.textContent = msg; el.className = 'status '+type;
  setTimeout(function(){ el.className='status'; }, 4000);
}

// Auto-load if session exists
(function(){
  var e = localStorage.getItem('cp_logged_in_user');
  var n = localStorage.getItem('cp_logged_in_name');
  var r = localStorage.getItem('cp_logged_in_role');
  if(e && n) {
    _email=e; _name=n; _role=r||'staff';
    // Pre-select in dropdown
    var sel = document.getElementById('name-select');
    for(var i=0;i<sel.options.length;i++){
      if(sel.options[i].value.startsWith(e+'|')){ sel.selectedIndex=i; break; }
    }
    showClock();
  }
})();
</script>
</body>
</html>
