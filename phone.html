<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone System — CP Restoration</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F8FAFC;color:#1E293B;}
header{background:#1B3A6B;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;}
header h1{color:white;font-size:16px;font-weight:800;}
header a{color:rgba(255,255,255,0.7);font-size:12px;text-decoration:none;}
.container{max-width:960px;margin:24px auto;padding:0 20px 40px;}
.card{background:white;border-radius:12px;border:1.5px solid #E2E8F0;padding:20px;margin-bottom:20px;}
.card h2{font-size:15px;font-weight:700;color:#1B3A6B;margin-bottom:14px;}
.status-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:13px;font-weight:600;}
.status-bar.green{background:#F0FDF4;border:1.5px solid #BBF7D0;color:#166534;}
.status-bar.red{background:#FEF2F2;border:1.5px solid #FECACA;color:#8B1A1A;}
.status-bar.yellow{background:#FFFBEB;border:1.5px solid #FDE68A;color:#92400E;}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.dot.green{background:#22C55E;}
.dot.red{background:#EF4444;}
.dot.yellow{background:#F59E0B;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
label{font-size:12px;font-weight:600;color:#475569;display:block;margin-bottom:4px;}
input,textarea{width:100%;padding:10px 12px;border:1.5px solid #E2E8F0;border-radius:8px;font-size:13px;font-family:inherit;margin-bottom:12px;}
input:focus,textarea:focus{outline:none;border-color:#1B3A6B;}
.btn{padding:10px 20px;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;}
.btn-navy{background:#1B3A6B;color:white;}
.btn-green{background:#166534;color:white;}
.btn-red{background:#8B1A1A;color:white;}
.btn-gray{background:#F1F5F9;color:#475569;border:1.5px solid #E2E8F0;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:640px){.grid2{grid-template-columns:1fr;}}
.dialpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:260px;margin:0 auto 14px;}
.dial-key{padding:14px;border:1.5px solid #E2E8F0;border-radius:10px;background:white;font-size:18px;font-weight:700;cursor:pointer;text-align:center;transition:all 0.1s;user-select:none;}
.dial-key:hover{background:#1B3A6B;color:white;border-color:#1B3A6B;}
.dial-key small{display:block;font-size:8px;color:#94A3B8;letter-spacing:1px;}
.dial-key:hover small{color:rgba(255,255,255,0.6);}
.number-input{width:100%;padding:14px;font-size:22px;font-weight:700;border:2px solid #E2E8F0;border-radius:10px;text-align:center;margin-bottom:12px;font-family:monospace;letter-spacing:2px;}
.call-btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:8px;}
.call-log-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #F1F5F9;}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;}
.badge-green{background:#DCFCE7;color:#166534;}
.badge-red{background:#FEE2E2;color:#8B1A1A;}
.badge-blue{background:#DBEAFE;color:#1E40AF;}
</style>
</head>
<body>
<header>
  <h1>&#128222; CP Restoration — Phone System (RingCentral)</h1>
  <a href="/dashboard.html">← Dashboard</a>
</header>
<div class="container">
  <div class="status-bar yellow" id="status-bar">
    <div class="dot yellow" id="status-dot"></div>
    <span id="status-text">Not connected — please log in</span>
  </div>

  <!-- Login -->
  <div id="login-section" class="card" style="max-width:460px;margin:0 auto 20px;">
    <h2>&#128274; Connect to RingCentral</h2>
    <label>RingCentral Email</label>
    <input type="email" id="rc-user" value="crownitstaffingandrecruiting@gmail.com">
    <label>Extension (leave blank if none)</label>
    <input type="text" id="rc-ext" placeholder="Leave blank">
    <label>Password</label>
    <input type="password" id="rc-pass" placeholder="RingCentral password">
    <button class="btn btn-navy" style="width:100%;padding:12px;font-size:14px;" onclick="rcConnect()" id="connect-btn">&#128222; Connect to RingCentral</button>
    <div id="login-msg" style="margin-top:10px;font-size:13px;text-align:center;min-height:20px;"></div>
  </div>

  <!-- Phone UI -->
  <div id="phone-ui" style="display:none;">
    <div class="grid2">
      <div class="card">
        <h2>&#128222; Make a Call</h2>
        <input type="tel" class="number-input" id="dial-num" placeholder="Enter number...">
        <div class="dialpad">
          <div class="dial-key" onclick="dp('1')">1<small>&nbsp;</small></div>
          <div class="dial-key" onclick="dp('2')">2<small>ABC</small></div>
          <div class="dial-key" onclick="dp('3')">3<small>DEF</small></div>
          <div class="dial-key" onclick="dp('4')">4<small>GHI</small></div>
          <div class="dial-key" onclick="dp('5')">5<small>JKL</small></div>
          <div class="dial-key" onclick="dp('6')">6<small>MNO</small></div>
          <div class="dial-key" onclick="dp('7')">7<small>PQRS</small></div>
          <div class="dial-key" onclick="dp('8')">8<small>TUV</small></div>
          <div class="dial-key" onclick="dp('9')">9<small>WXYZ</small></div>
          <div class="dial-key" onclick="dp('*')">*</div>
          <div class="dial-key" onclick="dp('0')">0<small>+</small></div>
          <div class="dial-key" onclick="dp('#')">#</div>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:10px;">
          <button class="btn btn-gray" style="flex:1;" onclick="document.getElementById('dial-num').value=document.getElementById('dial-num').value.slice(0,-1)">&#9003; Del</button>
          <button class="btn btn-gray" style="flex:1;" onclick="document.getElementById('dial-num').value=''">Clear</button>
        </div>
        <button class="call-btn btn-green" id="call-btn" onclick="makeCall()">&#9205; Call</button>
        <button class="call-btn btn-red" id="hangup-btn" style="display:none;" onclick="hangUp()">&#128308; End Call</button>
        <div id="call-status" style="text-align:center;font-size:12px;color:#64748B;margin-top:8px;min-height:18px;"></div>
      </div>

      <div class="card">
        <h2>&#9889; Quick Dial & SMS</h2>
        <button onclick="setNum('+18553275847')" style="width:100%;padding:10px;border:1.5px solid #E2E8F0;border-radius:8px;text-align:left;background:white;cursor:pointer;font-size:13px;margin-bottom:6px;">&#128241; CP Main — 1-855-327-5847</button>
        <button onclick="setNum('+12407883555')" style="width:100%;padding:10px;border:1.5px solid #E2E8F0;border-radius:8px;text-align:left;background:white;cursor:pointer;font-size:13px;margin-bottom:16px;">&#128222; RC Line — (240) 788-3555</button>
        <div style="border-top:1px solid #E2E8F0;padding-top:14px;">
          <label>Send SMS</label>
          <input type="tel" id="sms-to" placeholder="To: phone number">
          <textarea id="sms-body" placeholder="Message..." style="min-height:70px;resize:none;"></textarea>
          <button class="btn btn-navy" style="width:100%;" onclick="sendSMS()">&#9993; Send SMS</button>
          <div id="sms-status" style="font-size:12px;margin-top:6px;text-align:center;min-height:18px;"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <h2 style="margin:0;">&#128203; Recent Calls</h2>
        <button class="btn btn-gray" onclick="loadCallLog()" style="font-size:12px;padding:6px 14px;">&#8635; Refresh</button>
      </div>
      <div id="call-log-body"><div style="text-align:center;padding:20px;color:#94A3B8;">Loading...</div></div>
    </div>
  </div>
</div>

<script>
var RC_FROM = '+12407883555';
var PROXY = '/.netlify/functions/rc-proxy';
var accessToken = null;

(function(){
  var p = new URLSearchParams(window.location.search);
  var n = p.get('number');
  if (n) document.getElementById('dial-num').value = n;
})();

function setStatus(text, color) {
  document.getElementById('status-bar').className = 'status-bar ' + color;
  document.getElementById('status-dot').className = 'dot ' + color;
  document.getElementById('status-text').textContent = text;
}

function dp(d) { document.getElementById('dial-num').value += d; }
function setNum(n) { document.getElementById('dial-num').value = n; }

async function rcConnect() {
  var user = document.getElementById('rc-user').value.trim();
  var ext = document.getElementById('rc-ext').value.trim();
  var pass = document.getElementById('rc-pass').value.trim();
  var msg = document.getElementById('login-msg');
  var btn = document.getElementById('connect-btn');

  if (!user || !pass) { msg.style.color='#8B1A1A'; msg.textContent='Enter email and password.'; return; }
  btn.textContent='Connecting...'; btn.disabled=true;
  msg.style.color='#64748B'; msg.textContent='Authenticating with RingCentral...';
  setStatus('Connecting...','yellow');

  try {
    var resp = await fetch(PROXY, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ action:'auth', username:user, password:pass, extension:ext })
    });
    var data = await resp.json();
    if (data.access_token) {
      accessToken = data.access_token;
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('phone-ui').style.display = 'block';
      setStatus('✅ Connected — RingCentral Ready (+12407883555)','green');
      loadCallLog();
    } else {
      throw new Error(data.error_description || data.message || JSON.stringify(data));
    }
  } catch(e) {
    msg.style.color='#8B1A1A';
    msg.textContent='❌ ' + e.message;
    setStatus('Connection failed','red');
    btn.textContent='📞 Connect to RingCentral'; btn.disabled=false;
  }
}

async function apiCall(method, path, body) {
  var resp = await fetch(PROXY, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ action:'api', accessToken, method, path, body })
  });
  return resp.json();
}

async function makeCall() {
  var num = document.getElementById('dial-num').value.replace(/[^0-9+]/g,'');
  if (!num || num.length < 7) { alert('Enter a valid number.'); return; }
  if (!num.startsWith('+')) num = '+1' + num.replace(/^1/,'');
  document.getElementById('call-status').textContent = 'Calling ' + num + '...';
  document.getElementById('call-btn').style.display='none';
  document.getElementById('hangup-btn').style.display='block';
  setStatus('Calling ' + num + '...','yellow');
  try {
    var data = await apiCall('POST','/restapi/v1.0/account/~/extension/~/ring-out',{
      from:{phoneNumber:RC_FROM}, to:{phoneNumber:num}, playPrompt:true
    });
    if (data && data.id) {
      document.getElementById('call-status').textContent = '📞 Your phone will ring first, then connect to ' + num;
      setStatus('On call with ' + num,'yellow');
    } else {
      throw new Error((data && data.message) || 'Call failed');
    }
  } catch(e) {
    document.getElementById('call-status').textContent = '❌ ' + e.message;
    document.getElementById('call-btn').style.display='block';
    document.getElementById('hangup-btn').style.display='none';
    setStatus('Connected — Ready','green');
  }
}

function hangUp() {
  document.getElementById('call-btn').style.display='block';
  document.getElementById('hangup-btn').style.display='none';
  document.getElementById('call-status').textContent='Call ended.';
  setStatus('Connected — Ready','green');
  setTimeout(function(){document.getElementById('call-status').textContent='';},3000);
  loadCallLog();
}

async function sendSMS() {
  var to = document.getElementById('sms-to').value.replace(/[^0-9+]/g,'');
  var body = document.getElementById('sms-body').value.trim();
  var stat = document.getElementById('sms-status');
  if (!to||!body) { stat.style.color='#8B1A1A'; stat.textContent='Enter number and message.'; return; }
  if (!to.startsWith('+')) to='+1'+to;
  stat.style.color='#64748B'; stat.textContent='Sending...';
  try {
    var data = await apiCall('POST','/restapi/v1.0/account/~/extension/~/sms',{
      from:{phoneNumber:RC_FROM}, to:[{phoneNumber:to}], text:body
    });
    if (data && data.id) {
      stat.style.color='#166534'; stat.textContent='✅ SMS sent!';
      document.getElementById('sms-body').value='';
    } else throw new Error((data&&data.message)||'Failed');
  } catch(e) { stat.style.color='#8B1A1A'; stat.textContent='❌ '+e.message; }
}

async function loadCallLog() {
  var div = document.getElementById('call-log-body');
  try {
    var data = await apiCall('GET','/restapi/v1.0/account/~/extension/~/call-log?perPage=20&view=Simple');
    if (!data||!data.records) { div.innerHTML='<div style="text-align:center;padding:16px;color:#94A3B8;">No records.</div>'; return; }
    div.innerHTML = data.records.map(function(c) {
      var inbound=c.direction==='Inbound', missed=c.result==='Missed';
      var icon=missed?'📵':inbound?'📲':'📞';
      var bg=missed?'#FEE2E2':inbound?'#DCFCE7':'#DBEAFE';
      var name=inbound?(c.from&&(c.from.name||c.from.phoneNumber)||'Unknown'):(c.to&&(c.to.name||c.to.phoneNumber)||'Unknown');
      var num=inbound?(c.from&&c.from.phoneNumber||''):(c.to&&c.to.phoneNumber||'');
      var ts=c.startTime?new Date(c.startTime).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
      var dur=c.duration?Math.floor(c.duration/60)+'m '+(c.duration%60)+'s':'';
      var badge=missed?'<span class="badge badge-red">Missed</span>':inbound?'<span class="badge badge-green">'+dur+'</span>':'<span class="badge badge-blue">'+dur+'</span>';
      return '<div class="call-log-item">'+
        '<div style="width:34px;height:34px;border-radius:50%;background:'+bg+';display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;">'+icon+'</div>'+
        '<div style="flex:1;"><div style="font-size:13px;font-weight:600;">'+name+'</div><div style="font-size:11px;color:#64748B;">'+num+' &middot; '+ts+'</div></div>'+
        badge+
        (num?'<button onclick="setNum(''+num+'')" class="btn btn-gray" style="margin-left:8px;padding:4px 10px;font-size:11px;">Call Back</button>':'')+
      '</div>';
    }).join('');
  } catch(e) {
    div.innerHTML='<div style="text-align:center;padding:16px;color:#8B1A1A;">Error: '+e.message+'</div>';
  }
}

document.getElementById('dial-num').addEventListener('keydown',function(e){if(e.key==='Enter')makeCall();});
document.getElementById('rc-pass').addEventListener('keydown',function(e){if(e.key==='Enter')rcConnect();});
</script>
</body>
</html>
