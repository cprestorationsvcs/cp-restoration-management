<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CP Restoration — Status Update Tool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,sans-serif;background:#F8FAFC;color:#1E293B;min-height:100vh;}
.topbar{background:#1B3A6B;padding:13px 20px;display:flex;align-items:center;gap:14px;}
.topbar h1{color:white;font-size:15px;font-weight:800;flex:1;}
.topbar a{color:rgba(255,255,255,.75);font-size:12px;text-decoration:none;}
.wrap{max-width:1100px;margin:0 auto;padding:20px;}
.card{background:white;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.07);margin-bottom:20px;}
.card-head{padding:16px 20px;border-bottom:1px solid #E2E8F0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.card-title{font-size:15px;font-weight:700;color:#1B3A6B;}
.card-sub{font-size:12px;color:#64748B;}
.card-body{padding:20px;}
.btn{padding:9px 18px;border-radius:8px;border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-navy{background:#1B3A6B;color:white;}
.btn-green{background:#166534;color:white;}
.btn-gold{background:#C9A84C;color:white;}
.btn-sm{padding:6px 14px;font-size:12px;}
.search-row{display:flex;gap:10px;margin-bottom:12px;}
.search-row input{flex:1;padding:10px 14px;border:1.5px solid #E2E8F0;border-radius:8px;font-size:14px;font-family:inherit;}
.result-item{padding:12px 14px;border:1.5px solid #E2E8F0;border-radius:8px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;background:white;}
.result-item:hover{border-color:#1B3A6B;background:#EFF4FF;cursor:pointer;}
.result-name{font-weight:700;font-size:14px;}
.result-sub{font-size:12px;color:#64748B;margin-top:2px;}
.result-badge{font-size:11px;color:#166534;font-weight:700;background:#DCFCE7;padding:3px 10px;border-radius:10px;}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:20px;padding:14px;background:#EFF4FF;border-radius:10px;}
.info-item label{font-size:10px;font-weight:700;color:#64748B;text-transform:uppercase;display:block;margin-bottom:3px;}
.info-item span{font-size:13px;font-weight:600;}
.prog-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.prog-card{background:#F8FAFC;border-radius:10px;padding:14px;text-align:center;border:1.5px solid #E2E8F0;}
.prog-num{font-size:26px;font-weight:800;color:#1B3A6B;}
.prog-label{font-size:11px;color:#64748B;font-weight:600;margin-top:4px;}
.prog-bar-wrap{background:#E2E8F0;border-radius:20px;height:8px;margin-top:8px;overflow:hidden;}
.prog-bar{height:8px;border-radius:20px;background:#166534;transition:.5s;}
.bureau-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.btab{padding:7px 16px;border-radius:20px;border:2px solid #E2E8F0;font-size:12px;font-weight:700;cursor:pointer;background:white;}
.btab.active-all{background:#64748B;color:white;border-color:#64748B;}
.btab.active-eq{background:#E53E3E;color:white;border-color:#E53E3E;}
.btab.active-ex{background:#1B3A6B;color:white;border-color:#1B3A6B;}
.btab.active-tu{background:#166534;color:white;border-color:#166534;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:#F8FAFC;padding:10px 12px;text-align:left;font-size:11px;font-weight:700;color:#64748B;text-transform:uppercase;border-bottom:2px solid #E2E8F0;}
td{padding:11px 12px;border-bottom:1px solid #F1F5F9;vertical-align:middle;}
tr:hover td{background:#FAFBFF;}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.b-del{background:#DCFCE7;color:#166534;}
.b-pen{background:#FEF3C7;color:#92400E;}
.b-fil{background:#EFF4FF;color:#1B3A6B;}
.dot-eq{background:#FEE2E2;color:#991B1B;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;}
.dot-ex{background:#EFF4FF;color:#1B3A6B;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;}
.dot-tu{background:#DCFCE7;color:#166534;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;}
.tog{padding:4px 10px;border-radius:6px;border:1.5px solid #E2E8F0;font-size:11px;font-weight:700;cursor:pointer;background:white;margin-right:3px;}
.tog-del{background:#DCFCE7;color:#166534;border-color:#166534;}
.tog-pen{background:#FEF3C7;color:#92400E;border-color:#C9A84C;}
.add-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;align-items:end;margin-top:16px;padding-top:16px;border-top:1px solid #E2E8F0;}
.add-row input,.add-row select{padding:8px 10px;border:1.5px solid #E2E8F0;border-radius:8px;font-size:13px;font-family:inherit;}
.add-row label{font-size:11px;font-weight:600;color:#64748B;display:block;margin-bottom:4px;}
.notify-box{background:#F0FFF4;border:1.5px solid #166534;border-radius:10px;padding:16px;margin-top:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.notify-info{font-size:12px;color:#166534;line-height:1.8;}
.empty{text-align:center;padding:32px;color:#94A3B8;font-size:13px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:11px 24px;border-radius:8px;font-size:13px;font-weight:700;z-index:9999;color:white;box-shadow:0 4px 16px rgba(0,0,0,.2);pointer-events:none;}
</style>
</head>
<body>
<div class="topbar">
  <h1>&#128202; CP Restoration — Status Update Tool</h1>
  <a href="/client-manager.html">&#8592; Client Manager</a>
  <a href="/dashboard.html">&#8962; Dashboard</a>
</div>
<div class="wrap">

  <!-- SEARCH -->
  <div class="card">
    <div class="card-head">
      <div><div class="card-title">&#128269; Find Client</div><div class="card-sub">Search by name, ID, or email</div></div>
    </div>
    <div class="card-body">
      <div class="search-row">
        <input type="text" id="q" placeholder="Type client name, ID, or email..." oninput="doSearch()">
        <button class="btn btn-navy" onclick="doSearch()">Search</button>
      </div>
      <div id="results"></div>
    </div>
  </div>

  <!-- CLIENT PANEL -->
  <div id="panel" style="display:none;">
    <div class="card">
      <div class="card-head">
        <div><div class="card-title" id="p-name"></div><div class="card-sub" id="p-sub"></div></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-gold btn-sm" onclick="addItem()">+ Add Item</button>
          <button class="btn btn-navy btn-sm" onclick="saveChanges()">&#128190; Save</button>
          <button class="btn btn-green btn-sm" onclick="sendEmail()">&#9993; Send Update Email</button>
        </div>
      </div>
      <div class="card-body">
        <div class="info-grid" id="p-info"></div>
        <div class="prog-grid" id="p-prog"></div>
        <div class="bureau-tabs">
          <div class="btab active-all" id="tab-all" onclick="filter('all')">All Items</div>
          <div class="btab" id="tab-eq" onclick="filter('equifax')">&#9679; Equifax</div>
          <div class="btab" id="tab-ex" onclick="filter('experian')">&#9679; Experian</div>
          <div class="btab" id="tab-tu" onclick="filter('transunion')">&#9679; TransUnion</div>
        </div>
        <div style="overflow-x:auto;">
          <table><thead><tr><th>Account / Item</th><th>Type</th><th>Bureau</th><th>Date</th><th>Status</th><th>Update</th></tr></thead>
          <tbody id="p-table"></tbody></table>
        </div>
        <div class="add-row">
          <div><label>Item Name</label><input id="n-name" placeholder="e.g. Capital One Auto"></div>
          <div><label>Type</label><select id="n-type"><option>Account</option><option>Hard Inquiry</option><option>Collection</option></select></div>
          <div><label>Bureau</label><select id="n-bureau"><option value="equifax">Equifax</option><option value="experian">Experian</option><option value="transunion">TransUnion</option><option value="all">All Bureaus</option></select></div>
          <div><label>Status</label><select id="n-status"><option value="pending">Pending</option><option value="filed">Filed</option><option value="removed">Deleted</option></select></div>
          <button class="btn btn-navy" onclick="addItem()" style="height:38px;">+ Add</button>
        </div>
        <div class="notify-box">
          <div class="notify-info">
            <b>Portal:</b> portal-cprestorationsvcs.com/client-portal.html<br>
            <b>User ID:</b> <span id="p-id-display"></span> &nbsp; <b>Password:</b> restore2026
          </div>
          <button class="btn btn-green" onclick="sendEmail()">&#9993; Send Status Email to Client</button>
        </div>
      </div>
    </div>
  </div>

</div>
<script>
var SUPA = 'https://jzkfembagpiuuoexmpoy.supabase.co/rest/v1';
var KEY  = ['eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6a2ZlbWJhZ3BpdXVvZXhtcG95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NzYwNjEsImV4cCI6MjEwNjM1MjA2MX0','8euoI8CGkr3GBFiTrlaEmO8DtVyCF9jVaWPGORScg50'].join('.');
var HDR  = {apikey:KEY,'Authorization':'Bearer '+KEY};
var client = null, items = [], filterBy = 'all', timer = null;

// ── SEARCH ──
function doSearch() {
  clearTimeout(timer);
  var q = document.getElementById('q').value.trim();
  var res = document.getElementById('results');
  if (q.length < 2) { res.innerHTML = ''; return; }
  res.innerHTML = '<div style="padding:10px;color:#64748B;">Searching...</div>';
  timer = setTimeout(function(){ runSearch(q); }, 350);
}

async function runSearch(q) {
  var res = document.getElementById('results');
  var enc = encodeURIComponent(q);
  var sel = 'id,name,email,phone,start_date,package,status,disputes,notes';
  var found = [];
  var endpoints = [
    SUPA+'/clients?name=ilike.*'+enc+'*&limit=8&select='+sel,
    SUPA+'/clients?id=ilike.*'+enc+'*&limit=8&select='+sel,
    SUPA+'/clients?email=ilike.*'+enc+'*&limit=8&select='+sel
  ];
  for (var i=0; i<endpoints.length && !found.length; i++) {
    try {
      var r = await fetch(endpoints[i], {headers:HDR});
      var d = await r.json();
      if (Array.isArray(d) && d.length) found = d;
    } catch(e) {}
  }
  if (!found.length) { res.innerHTML = '<div class="empty">No clients found for "'+q+'"</div>'; return; }
  res.innerHTML = '';
  found.forEach(function(c) {
    var div = document.createElement('div');
    div.className = 'result-item';
    div.innerHTML = '<div><div class="result-name">'+safe(c.name)+'</div><div class="result-sub">'+safe(c.id)+' | '+safe(c.email||'')+'</div></div><div class="result-badge">'+(c.status||'Active')+'</div>';
    div.onclick = function() { loadClient(c); };
    res.appendChild(div);
  });
}

// ── LOAD CLIENT ──
function loadClient(c) {
  client = c;
  // Parse disputes
  try {
    var d = typeof c.disputes==='string' ? JSON.parse(c.disputes) : (c.disputes||[]);
    items = Array.isArray(d) ? d : [];
  } catch(e) { items = []; }
  // If no items, parse from notes
  if (!items.length && c.notes) items = parseNotes(c.notes);

  document.getElementById('panel').style.display = 'block';
  document.getElementById('results').innerHTML = '';
  document.getElementById('q').value = '';
  document.getElementById('p-name').textContent = c.name;
  document.getElementById('p-sub').textContent = (c.id||'') + ' — ' + (c.package||'Standard') + ' Package';
  document.getElementById('p-id-display').textContent = c.id;
  document.getElementById('p-info').innerHTML = [
    ['Client ID',c.id],['Email',c.email||'—'],['Phone',c.phone||'—'],
    ['Package',c.package||'Standard'],['Start Date',c.start_date?new Date(c.start_date).toLocaleDateString():'—'],['Status',c.status||'Active']
  ].map(function(f){ return '<div class="info-item"><label>'+f[0]+'</label><span>'+safe(f[1])+'</span></div>'; }).join('');
  filterBy = 'all';
  setTab('all');
  render();
  document.getElementById('panel').scrollIntoView({behavior:'smooth'});
}

// ── PARSE NOTES ──
function parseNotes(notes) {
  var result = [], bureau = 'all';
  notes.split('\n').forEach(function(line) {
    var l = line.trim();
    if (!l) return;
    var ll = l.toLowerCase();
    if (ll.includes('equifax'))    { bureau='equifax'; return; }
    if (ll.includes('transunion')) { bureau='transunion'; return; }
    if (ll.includes('experian'))   { bureau='experian'; return; }
    var status = ll.includes('deleted')||ll.includes('✅') ? 'removed' : 'pending';
    var name = l.replace(/^[✅⏳\-•\*\d\.\)]+\s*/,'').replace(/\s*[—-]\s*(DELETED|PENDING|FILED).*/i,'').trim();
    var type = /inquiry/i.test(name)?'Hard Inquiry':/collection/i.test(name)?'Collection':'Account';
    if (name.length>3 && name.length<80) result.push({name:name,type:type,bureau:bureau,status:status,date:''});
  });
  return result;
}

// ── RENDER TABLE ──
function render() {
  renderProgress();
  var tbody = document.getElementById('p-table');
  var show = filterBy==='all' ? items : items.filter(function(d){ return (d.bureau||'all')===filterBy || d.bureau==='all'; });
  if (!show.length) { tbody.innerHTML = '<tr><td colspan="6" class="empty">No items. Use + Add Item below.</td></tr>'; return; }
  tbody.innerHTML = show.map(function(d) {
    var gi = items.indexOf(d);
    var bur = (d.bureau||'all').toLowerCase();
    var bdot = bur==='equifax'?'<span class="dot-eq">EQ</span>':bur==='experian'?'<span class="dot-ex">EX</span>':bur==='transunion'?'<span class="dot-tu">TU</span>':'<span class="dot-eq">EQ</span><span class="dot-ex">EX</span><span class="dot-tu">TU</span>';
    var bBadge = d.status==='removed'?'<span class="badge b-del">✅ Deleted</span>':d.status==='filed'?'<span class="badge b-fil">📋 Filed</span>':'<span class="badge b-pen">⏳ Pending</span>';
    return '<tr>'+
      '<td style="font-weight:600;">'+safe(d.name)+'</td>'+
      '<td style="color:#64748B;font-size:12px;">'+safe(d.type||'Account')+'</td>'+
      '<td>'+bdot+'</td>'+
      '<td style="font-size:11px;color:#64748B;">'+safe(d.date||'')+'</td>'+
      '<td>'+bBadge+'</td>'+
      '<td>'+
        '<button class="tog '+(d.status==='removed'?'tog-del':'')+'" onclick="setStatus('+gi+',\'removed\')">✅ Deleted</button>'+
        '<button class="tog '+(d.status==='pending'?'tog-pen':'')+'" onclick="setStatus('+gi+',\'pending\')">⏳ Pending</button>'+
        '<button class="tog" style="color:#8B1A1A;" onclick="removeItem('+gi+')">🗑</button>'+
      '</td>'+
    '</tr>';
  }).join('');
}

function setStatus(i, s) { if(items[i]){ items[i].status=s; items[i].date=new Date().toLocaleDateString(); render(); } }
function removeItem(i) { items.splice(i,1); render(); }

function filter(b) {
  filterBy = b;
  ['all','eq','ex','tu'].forEach(function(t){ document.getElementById('tab-'+t).className='btab'; });
  var map = {all:'active-all',equifax:'active-eq',experian:'active-ex',transunion:'active-tu'};
  var tabId = b==='all'?'tab-all':b==='equifax'?'tab-eq':b==='experian'?'tab-ex':'tab-tu';
  document.getElementById(tabId).classList.add(map[b]);
  render();
}

function setTab(b) {
  ['all','eq','ex','tu'].forEach(function(t){ document.getElementById('tab-'+t).className='btab'; });
  document.getElementById('tab-all').classList.add('active-all');
}

function renderProgress() {
  var total = items.length;
  var del   = items.filter(function(d){ return d.status==='removed'; }).length;
  var pct   = total>0?Math.round(del/total*100):0;
  var eq    = items.filter(function(d){ return (d.bureau||'').includes('equifax'); });
  var tu    = items.filter(function(d){ return (d.bureau||'').includes('transunion'); });
  var ex    = items.filter(function(d){ return (d.bureau||'').includes('experian'); });
  function pcard(num, label, p, color) {
    return '<div class="prog-card"><div class="prog-num" style="color:'+color+';">'+num+'</div><div class="prog-label">'+label+'</div><div class="prog-bar-wrap"><div class="prog-bar" style="width:'+p+'%;background:'+color+';"></div></div></div>';
  }
  document.getElementById('p-prog').innerHTML =
    pcard(pct+'%','Overall Progress',pct,'#166534')+
    pcard(del+'/'+total,'Items Deleted',pct,'#1B3A6B')+
    pcard(eq.filter(function(d){return d.status==='removed';}).length+'/'+eq.length,'Equifax',eq.length?Math.round(eq.filter(function(d){return d.status==='removed';}).length/eq.length*100):0,'#E53E3E')+
    pcard(tu.filter(function(d){return d.status==='removed';}).length+'/'+tu.length,'TransUnion',tu.length?Math.round(tu.filter(function(d){return d.status==='removed';}).length/tu.length*100):0,'#166534');
}

// ── ADD ITEM ──
function addItem() {
  var name = document.getElementById('n-name').value.trim();
  if (!name) { toast('Enter an item name','err'); return; }
  items.push({name:name,type:document.getElementById('n-type').value,bureau:document.getElementById('n-bureau').value,status:document.getElementById('n-status').value,date:new Date().toLocaleDateString()});
  document.getElementById('n-name').value='';
  render();
  toast('Item added');
}

// ── SAVE ──
async function saveChanges() {
  if (!client) return;
  try {
    // 1. Save to clients.disputes column (for client portal)
    var r = await fetch(SUPA+'/clients?id=eq.'+encodeURIComponent(client.id),{
      method:'PATCH',
      headers:Object.assign({'Content-Type':'application/json'},HDR),
      body:JSON.stringify({disputes:JSON.stringify(items),updated_at:new Date().toISOString()})
    });

    // 2. Also write to disputes table (for Dispute Center log)
    var removed = items.filter(function(i){return i.status==='removed';}).length;
    var pending = items.filter(function(i){return i.status==='pending';}).length;
    var bureauSet = [...new Set(items.map(function(i){return i.bureau;}).filter(Boolean))];
    var logEntry = {
      client_id:   client.id,
      client_name: client.name,
      client_email:client.email||'',
      client_phone:client.phone||'',
      bureaus:     bureauSet.join(','),
      status:      removed > 0 ? 'Completed' : 'In Progress',
      notes:       JSON.stringify(items),
      specialist:  'Dispute Department',
      next_action: pending > 0 ? pending+' items pending bureau response' : 'All items processed',
      filed_at:    new Date().toISOString()
    };
    await fetch(SUPA+'/disputes',{
      method:'POST',
      headers:Object.assign({'Content-Type':'application/json','Prefer':'return=minimal'},HDR),
      body:JSON.stringify(logEntry)
    });

    toast(r.ok?'✅ Saved — Dispute Center updated':'❌ Save failed: '+r.status, r.ok?'ok':'err');
  } catch(e){ toast('❌ '+e.message,'err'); }
}

// ── SEND EMAIL ──
async function sendEmail() {
  if (!client||!client.email) { toast('No email on file','err'); return; }
  await saveChanges();
  var del=items.filter(function(d){return d.status==='removed';}).length;
  var tot=items.length;
  var pct=tot>0?Math.round(del/tot*100):0;
  var body='Dear '+client.name+',\n\nHere is your credit repair status update from CP Restoration Services.\n\n'+
    'Progress: '+del+' of '+tot+' items deleted ('+pct+'% complete)\n\n'+
    'Log in to see your full detailed report:\n'+
    'Portal: portal-cprestorationsvcs.com/client-portal.html\n'+
    'User ID: '+client.id+'\nPassword: restore2026\n\n'+
    'Future updates will be sent via email. Questions? Message us through the portal — we respond within 24 hours Monday–Friday.\n\n'+
    'CP Restoration Services\ncprestorationsvcs@gmail.com\n1-855-327-5847\n35daycreditrepair.com';
  try {
    var r = await fetch('/.netlify/functions/email-proxy',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        personalizations:[{to:[{email:client.email,name:client.name}]}],
        from:{email:'cprestorationsvcs@gmail.com',name:'CP Restoration Services'},
        subject:'Your Credit Repair Status Update — CP Restoration Services',
        content:[{type:'text/plain',value:body},
          {type:'text/html',value:'<div style="font-family:Arial,sans-serif;max-width:600px;margin:0 auto;padding:24px;">'+
            '<div style="background:#1B3A6B;padding:20px;border-radius:10px 10px 0 0;"><h1 style="color:white;font-size:18px;margin:0;">CP Restoration Services</h1><p style="color:rgba(255,255,255,.8);font-size:13px;margin:6px 0 0;">Credit Repair Status Update</p></div>'+
            '<div style="border:1px solid #E2E8F0;border-top:none;border-radius:0 0 10px 10px;padding:24px;">'+
            '<p>Dear <b>'+client.name+'</b>,</p>'+
            '<div style="background:#F0FFF4;border:1.5px solid #166534;border-radius:10px;padding:20px;margin:16px 0;text-align:center;">'+
            '<div style="font-size:40px;font-weight:800;color:#166534;">'+pct+'%</div>'+
            '<div style="font-size:14px;color:#166534;font-weight:600;">'+del+' of '+tot+' items deleted</div>'+
            '<div style="background:#E2E8F0;border-radius:20px;height:10px;margin:12px 0;"><div style="background:#166534;width:'+pct+'%;height:10px;border-radius:20px;"></div></div></div>'+
            '<p>Log in to your portal to see your full report:</p>'+
            '<div style="background:#EFF4FF;border-radius:8px;padding:14px;margin:12px 0;font-size:13px;">'+
            '&#128279; <a href="https://portal-cprestorationsvcs.com/client-portal.html" style="color:#1B3A6B;font-weight:700;">portal-cprestorationsvcs.com/client-portal.html</a><br>'+
            '&#128272; User ID: <b>'+client.id+'</b><br>&#128274; Password: <b>restore2026</b></div>'+
