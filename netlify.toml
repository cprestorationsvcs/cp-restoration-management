[build]
  functions = "functions"

[functions]
  node_bundler = "zip"

[[redirects]]
  from = "/voice-webhook"
  to = "/.netlify/functions/voice-webhook"
  status = 200

[[redirects]]
  from = "/voice-webhook/*"
  to = "/.netlify/functions/voice-webhook"
  status = 200

[[redirects]]
  from = "/call-log"
  to = "/.netlify/functions/call-log"
  status = 200
