<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMS Inbox — CP Restoration</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F8FAFC;color:#1E293B;}
header{background:#1B3A6B;padding:14px 20px;display:flex;align-items:center;gap:12px;}
header img{height:30px;filter:brightness(0) invert(1);}
header h1{color:white;font-size:15px;font-weight:800;flex:1;}
header a{color:rgba(255,255,255,.7);font-size:12px;text-decoration:none;}
.wrap{max-width:900px;margin:0 auto;padding:20px;}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-bottom:20px;}
.stat{background:white;border-radius:10px;border:1.5px solid #E2E8F0;padding:14px;text-align:center;}
.sv{font-size:26px;font-weight:800;color:#1B3A6B;}.sl{font-size:11px;color:#64748B;margin-top:3px;text-transform:uppercase;font-weight:600;}
.compose{background:white;border-radius:12px;border:1.5px solid #E2E8F0;padding:20px;margin-bottom:20px;}
.compose h2{font-size:14px;font-weight:800;color:#1B3A6B;margin-bottom:14px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
@media(max-width:600px){.row2{grid-template-columns:1fr;}}
input,select,textarea{width:100%;padding:10px;border:1.5px solid #E2E8F0;border-radius:8px;font-size:13px;font-family:inherit;}
textarea{min-height:80px;resize:vertical;}
.btn-send{width:100%;padding:12px;background:#1B3A6B;color:white;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.fb{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;border:2px solid #E2E8F0;background:white;color:#64748B;}
.fb.active{background:#1B3A6B;color:white;border-color:#1B3A6B;}
.msg-list{display:grid;gap:10px;}
.msg-card{background:white;border-radius:10px;border:1.5px solid #E2E8F0;padding:14px;}
.msg-card.inbound{border-left:4px solid #166534;}
.msg-card.outbound{border-left:4px solid #1B3A6B;}
.msg-card.unread{background:#F0FDF4;}
.mtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px;}
.mfrom{font-size:13px;font-weight:800;color:#1B3A6B;}
.mbadge{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;}
.b-in{background:#DCFCE7;color:#166534;}
.b-out{background:#DBEAFE;color:#1E40AF;}
.b-unread{background:#FEF9C3;color:#92400E;}
.mtext{font-size:13px;color:#1E293B;line-height:1.6;margin-bottom:10px;}
.mtime{font-size:11px;color:#94A3B8;}
.reply-area{display:flex;gap:8px;margin-top:10px;}
.reply-area textarea{min-height:50px;flex:1;}
.btn-reply{padding:8px 16px;background:#1B3A6B;color:white;border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}
.empty{text-align:center;padding:60px;color:#94A3B8;}
#send-msg{font-size:12px;text-align:center;margin-top:8px;min-height:16px;}
</style>
</head>
<body>
<header>
  <img src="/images/logo.png" alt="CP Restoration">
  <h1>&#128172; SMS Inbox — Close Integration</h1>
  <a href="/dashboard.html">&larr; Back</a>
</header>
<div class="wrap">

  <div class="stats">
    <div class="stat"><div class="sv" id="ct-total">0</div><div class="sl">Total</div></div>
    <div class="stat"><div class="sv" style="color:#166534;" id="ct-unread">0</div><div class="sl">Unread</div></div>
    <div class="stat"><div class="sv" style="color:#1B3A6B;" id="ct-out">0</div><div class="sl">Sent</div></div>
  </div>

  <!-- Compose -->
  <div class="compose">
    <h2>&#9993; Send SMS via Close</h2>
    <div class="row2">
      <input id="sms-to" placeholder="To: +1 (954) 555-1234" type="tel">
      <select id="sms-from">
        <option value="jason@mycprteam.com">Jason — +1 754-600-4934</option>
        <option value="queen@mycprteam.com">Queen — +1 754-714-8877</option>
        <option value="bukunmi@mycprteam.com">Bukunmi — +1 754-345-3951</option>
        <option value="elna@mycprteam.com">Elna — +1 754-704-8665</option>
        <option value="jonah@mycprteam.com">Jonah — +1 754-298-2046</option>
        <option value="alec@mycprteam.com">Alec — +1 754-334-4660</option>
        <option value="anthon@mycprteam.com">Anthon — +1 754-600-4934</option>
      </select>
    </div>
    <div class="row2">
      <input id="sms-client-id" placeholder="Client ID (optional)">
      <input id="sms-client-name" placeholder="Client Name (optional)">
    </div>
    <textarea id="sms-text" placeholder="Type your message..."></textarea>
    <button class="btn-send" onclick="sendSMS()">&#9654; Send SMS</button>
    <div id="send-msg"></div>
  </div>

  <!-- Filters -->
  <div class="filters">
    <button class="fb active" data-f="all">All</button>
    <button class="fb" data-f="inbound">&#128229; Inbound</button>
    <button class="fb" data-f="outbound">&#128228; Outbound</button>
    <button class="fb" data-f="unread">&#128308; Unread</button>
    <button class="fb" onclick="load()" style="margin-left:auto;">&#8635; Refresh</button>
  </div>

  <div class="msg-list" id="msg-list">
    <div class="empty">Loading SMS inbox...</div>
  </div>
</div>

<script>
var SUPA = 'https://jzkfembagpiuuoexmpoy.supabase.co/rest/v1';
var KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6a2ZlbWJhZ3BpdXVvZXhtcG95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NzYwNjEsImV4cCI6MjEwNjM1MjA2MX0.8euoI8CGkr3GBFiTrlaEmO8DtVyCF9jVaWPGORScg50';
var HDR  = {apikey:KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'};
var all  = [];
var filt = 'all';

async function load() {
  try {
    var r = await fetch(SUPA+'/sms_inbox?order=created_at.desc&limit=200',{headers:HDR});
    all = await r.json();
    if (!Array.isArray(all)) all=[];
    counts(); render();
  } catch(e){ console.error(e); }
}

function counts() {
  document.getElementById('ct-total').textContent = all.length;
  document.getElementById('ct-unread').textContent = all.filter(function(m){return m.status==='unread';}).length;
  document.getElementById('ct-out').textContent = all.filter(function(m){return m.direction==='outbound';}).length;
}

function render() {
  var items = all.filter(function(m){
    if (filt==='inbound') return m.direction==='inbound';
    if (filt==='outbound') return m.direction==='outbound';
    if (filt==='unread') return m.status==='unread';
    return true;
  });
  var list = document.getElementById('msg-list');
  if (!items.length) { list.innerHTML='<div class="empty">No messages.</div>'; return; }
  list.innerHTML = items.map(function(m){
    var isIn = m.direction==='inbound';
    var time = m.created_at?new Date(m.created_at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
    var from = isIn?(m.from_number||'Unknown'):(m.sent_by||'CP Restoration');
    return '<div class="msg-card '+(m.direction||'')+' '+(m.status==='unread'?'unread':'')+'" data-id="'+m.id+'">' +
      '<div class="mtop">' +
        '<div class="mfrom">'+(isIn?'&#128229; From: ':'&#128228; To: ')+(isIn?m.from_number:m.to_number)+'</div>' +
        '<div style="display:flex;gap:6px;align-items:center;">' +
          '<span class="mbadge '+(isIn?'b-in':'b-out')+'">'+(isIn?'INBOUND':'OUTBOUND')+'</span>' +
          (m.status==='unread'?'<span class="mbadge b-unread">UNREAD</span>':'') +
        '</div>' +
      '</div>' +
      '<div class="mtext">'+esc(m.message||'')+'</div>' +
      '<div class="mtime">'+time+(m.client_name?' &bull; Client: '+esc(m.client_name):'')+(from?' &bull; '+esc(from):'')+'</div>' +
      (isIn?'<div class="reply-area">' +
        '<textarea class="reply-ta" placeholder="Type reply..." data-to="'+m.from_number+'"></textarea>' +
        '<button class="btn-reply" onclick="replyTo(this)">Reply</button>' +
      '</div>':'') +
    '</div>';
  }).join('');

  // Mark unread as read when viewed
  items.filter(function(m){return m.status==='unread';}).forEach(function(m){
    fetch(SUPA+'/sms_inbox?id=eq.'+m.id,{
      method:'PATCH',headers:Object.assign({},HDR,{Prefer:'return=minimal'}),
      body:JSON.stringify({status:'read'})
    });
  });
}

async function sendSMS() {
  var to   = document.getElementById('sms-to').value.trim().replace(/\D/g,'');
  var from_email = document.getElementById('sms-from').value;
  var text = document.getElementById('sms-text').value.trim();
  var msg  = document.getElementById('send-msg');
  if (!to||!text) { msg.style.color='#8B1A1A'; msg.textContent='Phone number and message required.'; return; }
  msg.style.color='#64748B'; msg.textContent='Sending...';
  try {
    var r = await fetch('/.netlify/functions/close-sms', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        action:'send', to:'+'+to, message:text,
        from_email, 
        client_id:document.getElementById('sms-client-id').value.trim()||null,
        client_name:document.getElementById('sms-client-name').value.trim()||null
      })
    });
    var d = await r.json();
    if (d.success) {
      msg.style.color='#166534'; msg.textContent='SMS sent!';
      document.getElementById('sms-to').value='';
      document.getElementById('sms-text').value='';
      document.getElementById('sms-client-id').value='';
      document.getElementById('sms-client-name').value='';
      setTimeout(function(){msg.textContent='';load();},1500);
    } else {
      msg.style.color='#8B1A1A'; msg.textContent='Error: '+(d.error||JSON.stringify(d));
    }
  } catch(e){ msg.style.color='#8B1A1A'; msg.textContent='Error: '+e.message; }
}

async function replyTo(btn) {
  var ta = btn.previousElementSibling;
  var to = ta.getAttribute('data-to');
  var text = ta.value.trim();
  if (!text) return;
  var from_email = localStorage.getItem('cp_logged_in_user') || 'jason@mycprteam.com';
  btn.disabled=true; btn.textContent='Sending...';
  try {
    var r = await fetch('/.netlify/functions/close-sms', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'send',to,message:text,from_email})
    });
    var d = await r.json();
    if (d.success) { ta.value=''; btn.textContent='Sent!'; setTimeout(function(){btn.textContent='Reply';btn.disabled=false;load();},1500); }
    else { btn.textContent='Error'; btn.disabled=false; alert('Error: '+(d.error||'Unknown')); }
  } catch(e){ btn.textContent='Error'; btn.disabled=false; }
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

document.querySelectorAll('.fb[data-f]').forEach(function(btn){
  btn.addEventListener('click',function(){
    filt=this.getAttribute('data-f');
    document.querySelectorAll('.fb').forEach(function(b){b.classList.remove('active');});
    this.classList.add('active');
    render();
  });
});

// Auto-select rep's number from session
var myEmail = localStorage.getItem('cp_logged_in_user');
if (myEmail) {
  var sel = document.getElementById('sms-from');
  for (var i=0;i<sel.options.length;i++) {
    if (sel.options[i].value === myEmail) { sel.selectedIndex=i; break; }
  }
}

document.addEventListener('DOMContentLoaded', load);
setInterval(load, 15000);
</script>
</body>
</html>
